linalg.row.swap=Swap rows {0} and {1}.
linalg.row.scale=Divide row {0} by {2} so its pivot is 1.
linalg.row.eliminate=Subtract {2} times row {1} from row {0} to clear its entry in the pivot column.
linalg.independent=The rank is {0}: every vector gives a column with a pivot, so the vectors are linearly independent.
linalg.dependent=The rank is {0}, less than the number of vectors: they are linearly dependent. A nontrivial combination giving the zero vector is {1} = 0.
linalg.map.summary=The map goes from R^{0} to R^{1}. The rank (dimension of the image) is {2} and the nullity (dimension of the kernel) is {3}: {2} + {3} = {0}, the rank-nullity theorem.
linalg.map.injective=It is injective: the kernel is only the zero vector.
linalg.map.notInjective=It is not injective: the kernel has nonzero vectors.
linalg.map.surjective=It is onto: the image is the whole target space.
linalg.map.notSurjective=It is not onto: the image is a proper subspace of the target space.

linalg.gs.first=The first vector has no earlier ones to subtract: u{0} = v{0} = {1}. Its squared norm is {2}; dividing by its norm gives the unit vector q{0} = {3}.
linalg.gs.project=From vector {0} we subtract its projections onto the earlier ones: u{0} = v{0} − ({4}) = {1}. Its squared norm is {2}; dividing by its norm gives q{0} = {3}.
linalg.qr.summary=A = Q·R, with Q = {0} (orthonormal columns) and R = {1} (upper triangular, with R[i][j] = qᵢ·aⱼ).
linalg.diag.yes=The matrix is diagonalizable: A = P·D·P⁻¹ with P = {0} (the eigenvectors as columns), D = {1} (the eigenvalues on the diagonal) and P⁻¹ = {2}.
linalg.diag.noReal=It cannot be diagonalized over the real numbers: the characteristic polynomial has complex roots or roots with no closed form, so there is no basis of real eigenvectors.
linalg.diag.defective=It is not diagonalizable: some eigenvalue has fewer independent eigenvectors (geometric multiplicity) than times it is a root of the characteristic polynomial (algebraic multiplicity), so there is no basis of eigenvectors.
