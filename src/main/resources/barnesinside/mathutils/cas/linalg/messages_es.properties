linalg.row.swap=Intercambiamos las filas {0} y {1}.
linalg.row.scale=Dividimos la fila {0} entre {2} para que su pivote sea 1.
linalg.row.eliminate=A la fila {0} le restamos {2} veces la fila {1} para anular su entrada en la columna del pivote.
linalg.independent=El rango es {0}: cada vector aporta una columna con pivote, así que los vectores son linealmente independientes.
linalg.dependent=El rango es {0}, menor que el número de vectores: son linealmente dependientes. Una combinación no trivial que da el vector cero es {1} = 0.
linalg.map.summary=La transformación va de ℝ^{0} a ℝ^{1}. El rango (dimensión de la imagen) es {2} y la nulidad (dimensión del núcleo) es {3}: {2} + {3} = {0}, el teorema de la dimensión.
linalg.map.injective=Es inyectiva: el núcleo es solo el vector cero.
linalg.map.notInjective=No es inyectiva: el núcleo tiene vectores distintos de cero.
linalg.map.surjective=Es sobreyectiva: la imagen es todo el espacio de llegada.
linalg.map.notSurjective=No es sobreyectiva: la imagen es un subespacio propio del espacio de llegada.

linalg.gs.first=El primer vector no tiene anteriores de los que restar: u{0} = v{0} = {1}. Su norma al cuadrado es {2}; al dividir entre su norma queda el vector unitario q{0} = {3}.
linalg.gs.project=Al vector {0} le restamos sus proyecciones sobre los anteriores: u{0} = v{0} − ({4}) = {1}. Su norma al cuadrado es {2}; al dividir entre su norma queda q{0} = {3}.
linalg.qr.summary=A = Q·R, con Q = {0} (columnas ortonormales) y R = {1} (triangular superior, con R[i][j] = qᵢ·aⱼ).
linalg.diag.yes=La matriz es diagonalizable: A = P·D·P⁻¹ con P = {0} (los autovectores por columnas), D = {1} (los autovalores en la diagonal) y P⁻¹ = {2}.
linalg.diag.noReal=No se puede diagonalizar sobre los números reales: el polinomio característico tiene raíces complejas o sin forma cerrada, así que no hay una base de autovectores reales.
linalg.diag.defective=No es diagonalizable: algún autovalor tiene menos autovectores independientes (multiplicidad geométrica) que veces es raíz del polinomio característico (multiplicidad algebraica), así que no hay una base de autovectores.
