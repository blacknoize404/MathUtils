# English texts for the step-by-step solutions.
# Placeholders like ${name} are replaced with the expression of the matching parameter.

# ---- Presentation
solution.kind.DERIVATIVE.problem=Differentiate ${f} with respect to ${x}.
solution.kind.DERIVATIVE.problem.order=Differentiate ${f} ${k} times with respect to ${x}.
solution.kind.LIMIT.problem=Compute the limit of ${f} as ${x} approaches ${a}.
solution.kind.LIMIT.problem.RIGHT=Compute the limit of ${f} as ${x} approaches ${a} from the right.
solution.kind.LIMIT.problem.LEFT=Compute the limit of ${f} as ${x} approaches ${a} from the left.
solution.kind.INTEGRAL.problem=Compute the integral of ${f} with respect to ${x}.
solution.status.DOES_NOT_EXIST=The limit does not exist.
solution.steps=Steps
solution.result=Result
solution.status.SOLVED=Solved.
solution.status.NON_ELEMENTAL=The result exists, but it cannot be written with elementary functions.
solution.status.UNSOLVED=I can't solve this yet.

# ---- General
rule.SIMPLIFY.title=Simplify
rule.SIMPLIFY.text=We simplify the expression.
rule.CONCLUSION_DIVERGES.title=Conclusion
rule.CONCLUSION_DIVERGES.text=The integral diverges: it has no finite value.
rule.CONCLUSION_NO_LIMIT.title=Conclusion
rule.CONCLUSION_NO_LIMIT.text=The limit does not exist.
rule.CONCLUSION_NON_ELEMENTAL.title=Conclusion
rule.CONCLUSION_NON_ELEMENTAL.text=The result exists, but it cannot be written with elementary functions.
rule.CONCLUSION_UNSOLVED.title=Conclusion
rule.CONCLUSION_UNSOLVED.text=We could not solve it: we do not give a result we cannot check.
rule.SIMPLIFY_NEUTRAL.title=Remove what changes nothing
rule.SIMPLIFY_NEUTRAL.text=Adding 0 or multiplying by 1 does not change the value, so we remove it.
rule.SIMPLIFY_SIGNS.title=Fix the signs
rule.SIMPLIFY_SIGNS.text=We put the signs together: two negatives make a positive and a single negative moves to the front.
rule.SIMPLIFY_FRACTION.title=Reduce the fraction
rule.SIMPLIFY_FRACTION.text=We remove from the top and the bottom what repeats.
rule.SIMPLIFY_COLLECT.title=Collect like terms
rule.SIMPLIFY_COLLECT.text=We add the terms that have the same letters.
rule.SIMPLIFY_NUMBERS.title=Multiply the numbers
rule.SIMPLIFY_NUMBERS.text=We multiply the numbers together and leave the letters as they are.
rule.SIMPLIFY_ORDER.title=Order the factors
rule.SIMPLIFY_ORDER.text=Only the order in which the factors are written changes: the value is the same.
rule.NEST_RETURN.title=Back to the previous step
rule.NEST_RETURN.text=With the substeps solved, we go back to the step that needed them and put their results together.
rule.NEST_RETURN_DERIVATIVE.title=Back to the previous step
rule.NEST_RETURN_DERIVATIVE.text=With the substeps solved, we go back to the step that needed them and put their results together.
rule.NEST_RETURN_LIMIT.title=Back to the previous step
rule.NEST_RETURN_LIMIT.text=With the substeps solved, we go back to the step that needed them and put their results together.
rule.NEST_RETURN_INTEGRAL.title=Back to the previous step
rule.NEST_RETURN_INTEGRAL.text=With the substeps solved, we go back to the step that needed them and put their results together.
rule.SOLUTION.title=Solution
rule.SOLUTION.text=With every step solved, this is the result.

# ---- Derivatives
rule.DIFF_CONSTANT.title=Derivative of a constant
rule.DIFF_CONSTANT.text=The derivative of a constant is 0.

rule.DIFF_OTHER_VARIABLE.title=Other variable as a constant
rule.DIFF_OTHER_VARIABLE.text=We differentiate with respect to ${x}, so ${y} is treated as a constant and its derivative is 0.

rule.DIFF_VARIABLE.title=Derivative of the variable
rule.DIFF_VARIABLE.text=The derivative of ${x} with respect to ${x} is 1.

rule.DIFF_CONSTANT_MULTIPLE.title=Constant multiple
rule.DIFF_CONSTANT_MULTIPLE.text=A constant factor comes out of the derivative: (c·f)' = c·f'. Here c = ${c} and f = ${f}.
rule.DIFF_CONSTANT_MULTIPLE_OTHER.title=Constant multiple
rule.DIFF_CONSTANT_MULTIPLE_OTHER.text=With respect to ${x}, the factor ${c} does not depend on ${x}: it is treated as a constant. A constant factor comes out of the derivative: (c·f)' = c·f'. Here c = ${c} and f = ${f}.
rule.DIFF_CHAIN_BACK.title=Undo the change of variable
rule.DIFF_CHAIN_BACK.text=We write u = ${u} back in what came out: F'(u)·u' with u substituted.

rule.DIFF_SUM.title=Sum rule
rule.DIFF_SUM.text=The derivative of a sum is the sum of the derivatives: (f + g)' = f' + g'. We differentiate each term separately.

rule.DIFF_POWER.title=Power rule
rule.DIFF_POWER.text=(${x}^n)' = n·${x}^(n − 1), with n = ${n}.

rule.DIFF_PRODUCT.title=Product rule
rule.DIFF_PRODUCT.text=To differentiate a product, differentiate each factor leaving the other as it is, and add the two results: (f·g)' = f'·g + f·g'. Here f = ${f} and g = ${g}.

rule.DIFF_QUOTIENT.title=Quotient rule
rule.DIFF_QUOTIENT.text=To differentiate a quotient, differentiate the numerator and the denominator separately and combine them like this: the derivative of the numerator times the denominator, minus the numerator times the derivative of the denominator, all divided by the denominator squared: (f/g)' = (f'·g − f·g')/g². Here f = ${f} and g = ${g}.

rule.DIFF_CHAIN.title=Chain rule
rule.DIFF_CHAIN.text=(F(u))' = F'(u)·u'. We take u = ${u}: we differentiate the outer function with respect to u and multiply by the derivative of u.

rule.DIFF_EXPONENTIAL_E.title=Derivative of the exponential
rule.DIFF_EXPONENTIAL_E.text=(e^${x})' = e^${x}.

rule.DIFF_EXPONENTIAL.title=Exponential with base a
rule.DIFF_EXPONENTIAL.text=(a^${x})' = a^${x}·ln(a), with a = ${a}.

rule.DIFF_LN.title=Derivative of the natural logarithm
rule.DIFF_LN.text=(ln(${x}))' = 1/${x}.

rule.DIFF_POWER_GENERAL.title=Logarithmic differentiation
rule.DIFF_POWER_GENERAL.text=Both the base and the exponent depend on the variable, so we take logarithms: (f^g)' = f^g·(g'·ln(f) + g·f'/f). Here f = ${f} and g = ${g}.

rule.DIFF_SIN.title=Derivative of sine
rule.DIFF_SIN.text=(sin(${x}))' = cos(${x}).

rule.DIFF_COS.title=Derivative of cosine
rule.DIFF_COS.text=(cos(${x}))' = −sin(${x}).

rule.DIFF_TAN.title=Derivative of tangent
rule.DIFF_TAN.text=(tan(${x}))' = sec(${x})².

rule.DIFF_COT.title=Derivative of cotangent
rule.DIFF_COT.text=(cot(${x}))' = −csc(${x})².

rule.DIFF_SEC.title=Derivative of secant
rule.DIFF_SEC.text=(sec(${x}))' = sec(${x})·tan(${x}).

rule.DIFF_CSC.title=Derivative of cosecant
rule.DIFF_CSC.text=(csc(${x}))' = −csc(${x})·cot(${x}).

rule.DIFF_ASIN.title=Derivative of arcsine
rule.DIFF_ASIN.text=(asin(${x}))' = 1/√(1 − ${x}²).

rule.DIFF_ACOS.title=Derivative of arccosine
rule.DIFF_ACOS.text=(acos(${x}))' = −1/√(1 − ${x}²).

rule.DIFF_ATAN.title=Derivative of arctangent
rule.DIFF_ATAN.text=(atan(${x}))' = 1/(1 + ${x}²).

rule.DIFF_SINH.title=Derivative of hyperbolic sine
rule.DIFF_SINH.text=(sinh(${x}))' = cosh(${x}).

rule.DIFF_COSH.title=Derivative of hyperbolic cosine
rule.DIFF_COSH.text=(cosh(${x}))' = sinh(${x}).

rule.DIFF_TANH.title=Derivative of hyperbolic tangent
rule.DIFF_TANH.text=(tanh(${x}))' = 1 − tanh(${x})².

rule.DIFF_ABS.title=Derivative of the absolute value
rule.DIFF_ABS.text=(|${x}|)' = ${x}/|${x}|, for ${x} different from 0.

rule.DIFF_ERF.title=Derivative of the error function
rule.DIFF_ERF.text=(erf(${x}))' = (2/√π)·e^(−${x}²).

rule.DIFF_ORDER.title=Higher-order derivative
rule.DIFF_ORDER.text=Derivative number ${k}: we differentiate the previous result again.

# ---- Order of operations
order.parentheses=First, what is inside the parentheses.
order.error.DIVISION_BY_ZERO=You can't divide by 0.
order.error.UNDEFINED=The result is not defined in the real numbers.

order.POWER.title=Power
order.POWER.text=We compute the power ${a}^${b} = ${r}. Powers come before products and sums.
order.FUNCTION.title=Function
order.FUNCTION.text=We evaluate ${f}(${a}) = ${r}. Functions are resolved together with powers, before products and sums.
order.NEGATION.title=Sign change
order.NEGATION.text=We change the sign of ${a}: −${a} = ${r}.
order.MULTIPLICATION.title=Multiplication
order.MULTIPLICATION.text=We multiply ${a} · ${b} = ${r}. Multiplications and divisions come before additions and subtractions, from left to right.
order.DIVISION.title=Division
order.DIVISION.text=We divide ${a} ÷ ${b} = ${r}. Multiplications and divisions come before additions and subtractions, from left to right.
order.ADDITION.title=Addition
order.ADDITION.text=We add ${a} + ${b} = ${r}. Additions and subtractions come last, from left to right.
order.SUBTRACTION.title=Subtraction
order.SUBTRACTION.text=We subtract ${a} − ${b} = ${r}. Additions and subtractions come last, from left to right.

# ---- Limits
rule.LIMIT_CONSTANT.title=Limit of a constant
rule.LIMIT_CONSTANT.text=The limit of a constant is the constant itself.

rule.LIMIT_DIRECT.title=Direct substitution
rule.LIMIT_DIRECT.text=We substitute ${x} = ${a}: the function is continuous at that point, so the limit is the resulting value.

rule.LIMIT_ALGEBRA.title=Limit laws
rule.LIMIT_ALGEBRA.text=We compute the limit of each part and combine them with the limit laws (sum, product and power).

rule.LIMIT_INFINITY_RATIONAL.title=Ratio of polynomials at infinity
rule.LIMIT_INFINITY_RATIONAL.text=At infinity, a ratio of polynomials behaves like the ratio of their highest-degree terms: the numerator has degree ${n} and the denominator has degree ${m}.

rule.LIMIT_LHOPITAL_ZERO.title=L'Hôpital's rule (0/0)
rule.LIMIT_LHOPITAL_ZERO.text=After substituting, numerator and denominator both approach 0 (indeterminate form 0/0). By L'Hôpital's rule, lim f/g = lim f'/g'. We differentiate the numerator ${n} and the denominator ${d} separately.

rule.LIMIT_LHOPITAL_INFINITY.title=L'Hôpital's rule (∞/∞)
rule.LIMIT_LHOPITAL_INFINITY.text=Numerator and denominator both approach infinity (indeterminate form ∞/∞). By L'Hôpital's rule, lim f/g = lim f'/g'. We differentiate the numerator ${n} and the denominator ${d} separately.

rule.LIMIT_PRODUCT_TO_QUOTIENT.title=Product of the form 0·∞
rule.LIMIT_PRODUCT_TO_QUOTIENT.text=This is a product of the form 0·∞. We write it as a quotient: ${n} divided by ${d}, which is an indeterminate form 0/0 or ∞/∞.

rule.LIMIT_COMBINE_FRACTIONS.title=Combine fractions
rule.LIMIT_COMBINE_FRACTIONS.text=The sum has the form ∞ − ∞. We combine the fractions into a single one.

rule.LIMIT_CONJUGATE.title=Multiply by the conjugate
rule.LIMIT_CONJUGATE.text=This has the form ∞ − ∞ with roots. We multiply and divide by the conjugate to remove them: (A − B)(A + B) = A² − B².

rule.LIMIT_EXPONENTIAL_FORM.title=Exponential form
rule.LIMIT_EXPONENTIAL_FORM.text=The power is an indeterminate form (1^∞, 0^0 or ∞^0). We write b^e = e^(e·ln b) and compute the limit of the exponent ${e}·ln(${b}).

rule.LIMIT_SIDES.title=One-sided limits
rule.LIMIT_SIDES.text=We compute the limit from the left and from the right. If they agree, that value is the limit.

rule.LIMIT_OSCILLATES.title=Oscillating function
rule.LIMIT_OSCILLATES.text=The function oscillates without approaching a value: the limit does not exist.

rule.LIMIT_DIFFERENT_SIDES.title=Different one-sided limits
rule.LIMIT_DIFFERENT_SIDES.text=The limits from the left and from the right are different: the limit does not exist.

# ---- Integrals
rule.INT_CONSTANT.title=Integral of a constant
rule.INT_CONSTANT.text=∫ c d${x} = c·${x}.

rule.INT_CONSTANT_MULTIPLE.title=Constant multiple
rule.INT_CONSTANT_MULTIPLE.text=A constant factor comes out of the integral: ∫ c·f d${x} = c·∫ f d${x}. Here c = ${c} and f = ${f}.

rule.INT_SUM.title=Sum rule
rule.INT_SUM.text=The integral of a sum is the sum of the integrals: ∫ (f + g) d${x} = ∫ f d${x} + ∫ g d${x}. We integrate each term.

rule.INT_POWER.title=Power rule
rule.INT_POWER.text=∫ ${x}^n d${x} = ${x}^(n + 1)/(n + 1), for n different from −1. Here n = ${n}.

rule.INT_RECIPROCAL.title=Integral of 1/x
rule.INT_RECIPROCAL.text=∫ 1/${x} d${x} = ln|${x}|.

rule.INT_EXPONENTIAL_E.title=Integral of the exponential
rule.INT_EXPONENTIAL_E.text=∫ e^${x} d${x} = e^${x}.

rule.INT_EXPONENTIAL.title=Exponential with base a
rule.INT_EXPONENTIAL.text=∫ a^${x} d${x} = a^${x}/ln(a), with a = ${a}.

rule.INT_SIN.title=Integral of sine
rule.INT_SIN.text=∫ sin(${x}) d${x} = −cos(${x}).

rule.INT_COS.title=Integral of cosine
rule.INT_COS.text=∫ cos(${x}) d${x} = sin(${x}).

rule.INT_TAN.title=Integral of tangent
rule.INT_TAN.text=∫ tan(${x}) d${x} = −ln|cos(${x})|.

rule.INT_COT.title=Integral of cotangent
rule.INT_COT.text=∫ cot(${x}) d${x} = ln|sin(${x})|.

rule.INT_SEC.title=Integral of secant
rule.INT_SEC.text=∫ sec(${x}) d${x} = ln|sec(${x}) + tan(${x})|.

rule.INT_CSC.title=Integral of cosecant
rule.INT_CSC.text=∫ csc(${x}) d${x} = −ln|csc(${x}) + cot(${x})|.

rule.INT_SEC_SQUARED.title=Integral of sec²
rule.INT_SEC_SQUARED.text=∫ sec²(${x}) d${x} = tan(${x}).

rule.INT_CSC_SQUARED.title=Integral of csc²
rule.INT_CSC_SQUARED.text=∫ csc²(${x}) d${x} = −cot(${x}).

rule.INT_SEC_TAN.title=Integral of sec·tan
rule.INT_SEC_TAN.text=∫ sec(${x})·tan(${x}) d${x} = sec(${x}).

rule.INT_CSC_COT.title=Integral of csc·cot
rule.INT_CSC_COT.text=∫ csc(${x})·cot(${x}) d${x} = −csc(${x}).

rule.INT_SINH.title=Integral of hyperbolic sine
rule.INT_SINH.text=∫ sinh(${x}) d${x} = cosh(${x}).

rule.INT_COSH.title=Integral of hyperbolic cosine
rule.INT_COSH.text=∫ cosh(${x}) d${x} = sinh(${x}).

rule.INT_TANH.title=Integral of hyperbolic tangent
rule.INT_TANH.text=∫ tanh(${x}) d${x} = ln(cosh(${x})).

rule.INT_ATAN_FORM.title=Arctangent form
rule.INT_ATAN_FORM.text=∫ 1/(${x}² + a²) d${x} = (1/a)·atan(${x}/a), with a = ${a}.

rule.INT_ASIN_FORM.title=Arcsine form
rule.INT_ASIN_FORM.text=∫ 1/√(a² − ${x}²) d${x} = asin(${x}/a), with a = ${a}.

rule.INT_LOG_FORM.title=Logarithmic form
rule.INT_LOG_FORM.text=∫ 1/(${x}² − a²) d${x} = (1/(2a))·ln|(${x} − a)/(${x} + a)|, with a = ${a}.

rule.INT_ASINH_FORM.title=Inverse hyperbolic sine form
rule.INT_ASINH_FORM.text=∫ 1/√(${x}² + c) d${x} = ln|${x} + √(${x}² + c)|, with c = ${c}.

rule.INT_EXPAND.title=Expand before integrating
rule.INT_EXPAND.text=We expand the product or power so we can integrate term by term.

rule.INT_SUBSTITUTION.title=Substitution
rule.INT_SUBSTITUTION.text=We take ${s} = ${u}, so d${s} = ${du} d${x}. The integral becomes a function of ${s} alone: ∫ ${g} d${s}.

rule.INT_PARTS.title=Integration by parts
rule.INT_PARTS.text=∫ u dv = u·v − ∫ v du. We take u = ${u} and dv = ${dv} d${x}; then du = ${du} d${x} and v = ${v}.

rule.INT_CYCLE.title=The integral repeats
rule.INT_CYCLE.text=The original integral shows up again. We call I the integral we want: I = (${a}) + (${c})·I. Solving for I, I = (${a})/(1 − (${c})).

rule.LIMIT_DOMINANT_TERMS.title=Dominant terms
rule.LIMIT_DOMINANT_TERMS.text=With the highest-degree term of each part, the function behaves like ${c}·${x}^(${p}). If the exponent is negative the limit is 0, if it is 0 the limit is the coefficient, and if it is positive the limit is infinite.

rule.LIMIT_ABSOLUTE_VALUE.title=Absolute value on one side
rule.LIMIT_ABSOLUTE_VALUE.text=On this side of ${a}, the sign of what is inside the absolute value does not change. We rewrite it without the absolute value.

rule.INT_POLYNOMIAL_DIVISION.title=Polynomial division
rule.INT_POLYNOMIAL_DIVISION.text=The degree of the numerator ${n} is not smaller than that of the denominator ${d}, so we divide the polynomials: the quotient is ${q} and the remainder is ${r}.
rule.INT_PARTIAL_FRACTIONS.title=Partial fractions
rule.INT_PARTIAL_FRACTIONS.text=We split ${n}/${d} into simple fractions, each easy to integrate, and integrate them one by one.
rule.INT_PF_FACTOR.title=Factor the denominator
rule.INT_PF_FACTOR.text=We factor the denominator: ${d} = ${factored}.
rule.INT_PF_SETUP.title=Set up the decomposition
rule.INT_PF_SETUP.text=We write the fraction as a sum of simple fractions with coefficients to find (one for each factor and its multiplicity): ${setup}.
rule.INT_PF_SOLVE.title=Find the coefficients
rule.INT_PF_SOLVE.text=Matching the numerators and solving the system of equations for the coefficients, the sum becomes ${parts}.
rule.INT_QUADRATIC_SPLIT.title=Split the numerator
rule.INT_QUADRATIC_SPLIT.text=The derivative of the denominator ${q} is ${dq}. We write the numerator as a multiple of ${dq} plus a constant, so one part is a logarithmic derivative and the other is a constant over ${q}.
rule.INT_COMPLETE_SQUARE.title=Complete the square
rule.INT_COMPLETE_SQUARE.text=The polynomial ${q} has no rational roots. Completing the square gives ${s}, and after shifting by ${u} the integral takes the arctangent form.
rule.INT_REDUCTION.title=Reduction formula
rule.INT_REDUCTION.text=For ∫ 1/(${x}² + ${d})^${k} d${x} we use the reduction formula ∫ 1/(${x}²+a)^n = ${x}/(2a(n−1)(${x}²+a)^(n−1)) + (2n−3)/(2a(n−1)) ∫ 1/(${x}²+a)^(n−1), which lowers the power by one.
rule.INT_TRIG_ODD_POWER.title=Odd power
rule.INT_TRIG_ODD_POWER.text=There is an odd exponent. We split off one factor ${keep} and write the rest with ${other} using sin²${x} + cos²${x} = 1. The integral becomes ∫ ${r} d${x}, ready for a substitution with ${other}.
rule.INT_TRIG_HALF_ANGLE.title=Half angle
rule.INT_TRIG_HALF_ANGLE.text=With even exponents we use the half-angle formulas: sin²${x} = (1 − cos 2${x})/2 and cos²${x} = (1 + cos 2${x})/2. The integrand becomes ${r}.
rule.INT_TRIG_TAN_SUBSTITUTION.title=Tangent and secant
rule.INT_TRIG_TAN_SUBSTITUTION.text=The exponents are even and their sum is negative. We write the integrand with tan ${x} and sec²${x} using sec²${x} = 1 + tan²${x}: it becomes ${r}. Since sec²${x} is the derivative of tan ${x}, a substitution with the tangent works.
rule.INT_TRIG_TAN_REDUCTION.title=Power of the tangent
rule.INT_TRIG_TAN_REDUCTION.text=For the power ${n} of the tangent we use tan²${x} = sec²${x} − 1. This gives ∫ tan^n ${x} d${x} = tan^(n−1) ${x}/(n−1) − ∫ tan^(n−2) ${x} d${x}.
rule.INT_TRIG_COT_REDUCTION.title=Power of the cotangent
rule.INT_TRIG_COT_REDUCTION.text=For the power ${n} of the cotangent we use cot²${x} = csc²${x} − 1. This gives ∫ cot^n ${x} d${x} = −cot^(n−1) ${x}/(n−1) − ∫ cot^(n−2) ${x} d${x}.
rule.INT_TRIG_SEC_REDUCTION.title=Power of the secant
rule.INT_TRIG_SEC_REDUCTION.text=For the odd power ${n} of the secant we integrate by parts and get ∫ sec^n ${x} d${x} = sec^(n−2) ${x} tan ${x}/(n−1) + (n−2)/(n−1) ∫ sec^(n−2) ${x} d${x}.
rule.INT_TRIG_CSC_REDUCTION.title=Power of the cosecant
rule.INT_TRIG_CSC_REDUCTION.text=For the odd power ${n} of the cosecant we integrate by parts and get ∫ csc^n ${x} d${x} = −csc^(n−2) ${x} cot ${x}/(n−1) + (n−2)/(n−1) ∫ csc^(n−2) ${x} d${x}.
rule.INT_TRIG_PRODUCT_TO_SUM.title=Product to sum
rule.INT_TRIG_PRODUCT_TO_SUM.text=A product of sines and cosines of different angles becomes a sum with sin A cos B = ½[sin(A+B) + sin(A−B)], cos A cos B = ½[cos(A−B) + cos(A+B)] and sin A sin B = ½[cos(A−B) − cos(A+B)]. It becomes ${r}.
rule.INT_TRIG_WEIERSTRASS.title=The tan(x/2) substitution
rule.INT_TRIG_WEIERSTRASS.text=Any rational function of sine and cosine becomes rational with ${s} = tan(${x}/2): sin ${x} = 2${s}/(1+${s}²), cos ${x} = (1−${s}²)/(1+${s}²) and d${x} = 2 d${s}/(1+${s}²). The integral becomes ∫ ${g} d${s}.
rule.INT_RADICAL_SUBSTITUTION.title=Substitution to remove the root
rule.INT_RADICAL_SUBSTITUTION.text=The root of a linear expression goes away with ${s} = ${u}. Then ${x} and d${x} are written with ${s}, and the integral becomes ∫ ${g} d${s}.
rule.INT_RADICAL_COMPLETE_SQUARE.title=Complete the square inside the root
rule.INT_RADICAL_COMPLETE_SQUARE.text=We complete the square in the radicand: ${q} = ${c}. With ${s} = ${shift} (d${s} = d${x}) the integral becomes ∫ ${g} d${s}.
rule.INT_TRIG_SUBSTITUTION_SIN.title=Trigonometric substitution with sine
rule.INT_TRIG_SUBSTITUTION_SIN.text=The radicand ${q} has the form a² − b²${x}². We take ${x} = ${xs}, so d${x} = ${dx} d${s} and the root is ${root} (with cos ${s} > 0). The integral becomes ∫ ${g} d${s}. At the end we go back to ${x} with ${s} = arcsin(${x}/${m}).
rule.INT_TRIG_SUBSTITUTION_TAN.title=Trigonometric substitution with tangent
rule.INT_TRIG_SUBSTITUTION_TAN.text=The radicand ${q} has the form a² + b²${x}². We take ${x} = ${xs}, so d${x} = ${dx} d${s} and the root is ${root}. The integral becomes ∫ ${g} d${s}. At the end we go back to ${x} with ${s} = arctan(${x}/${m}).
rule.INT_TRIG_SUBSTITUTION_SEC.title=Trigonometric substitution with secant
rule.INT_TRIG_SUBSTITUTION_SEC.text=The radicand ${q} has the form b²${x}² − a². We take ${x} = ${xs} (with ${x} > 0), so d${x} = ${dx} d${s} and the root is ${root}. The integral becomes ∫ ${g} d${s}. At the end we go back to ${x} with ${s} = arccos(${m}/|${x}|).
rule.INT_ROOT_DIFFERENCE_FORM.title=Root of a² − x²
rule.INT_ROOT_DIFFERENCE_FORM.text=With c = ${c}, the formula for ∫ √(c − ${x}²) d${x} (which comes from ${x} = √c sin t) is ${x}·√(c − ${x}²)/2 + (c/2)·arcsin(${x}/√c).
rule.INT_ROOT_SUM_FORM.title=Root of x² + c
rule.INT_ROOT_SUM_FORM.text=With c = ${c}, the formula for ∫ √(${x}² + c) d${x} is ${x}·√(${x}² + c)/2 + (c/2)·ln|${x} + √(${x}² + c)|.
rule.DIFF_SI.title=Derivative of the sine integral
rule.DIFF_SI.text=(Si(${x}))' = sin(${x})/${x}.
rule.DIFF_CI.title=Derivative of the cosine integral
rule.DIFF_CI.text=(Ci(${x}))' = cos(${x})/${x}.
rule.DIFF_EI.title=Derivative of the exponential integral
rule.DIFF_EI.text=(Ei(${x}))' = e^${x}/${x}.
rule.DIFF_LI.title=Derivative of the logarithmic integral
rule.DIFF_LI.text=(li(${x}))' = 1/ln(${x}).
rule.INT_ERF_FORM.title=Error function
rule.INT_ERF_FORM.text=The integral of e^(−${a}${x}²) cannot be written with elementary functions. It is defined with the error function erf(z) = (2/√π)∫_0^z e^(−t²) dt; with z = √${a}·${x} it gives √π/(2√${a})·erf(√${a}·${x}).
rule.INT_SI_FORM.title=Sine integral
rule.INT_SI_FORM.text=sin(${x})/${x} has no elementary antiderivative. Its antiderivative is defined as the sine integral Si(${x}) = ∫_0^${x} sin(t)/t dt.
rule.INT_CI_FORM.title=Cosine integral
rule.INT_CI_FORM.text=cos(${x})/${x} has no elementary antiderivative. Its antiderivative is defined as the cosine integral Ci(${x}) = γ + ln ${x} + ∫_0^${x} (cos t − 1)/t dt.
rule.INT_EI_FORM.title=Exponential integral
rule.INT_EI_FORM.text=e^${x}/${x} has no elementary antiderivative. Its antiderivative is defined as the exponential integral Ei(${x}).
rule.INT_LI_FORM.title=Logarithmic integral
rule.INT_LI_FORM.text=This integral is not elementary. With the substitution ${x}^${n} = e^s it reduces to the exponential integral, and its antiderivative is the logarithmic integral li(${x}^${n}) = Ei(${n}·ln ${x}).
rule.INT_EI_REDUCTION.title=Reduction with the exponential integral
rule.INT_EI_REDUCTION.text=Integrating by parts, ∫ e^${x}/${x}^${n} d${x} = −e^${x}/((${n}−1)·${x}^(${n}−1)) + 1/(${n}−1)·∫ e^${x}/${x}^(${n}−1) d${x}, which lowers the power by one.
solution.kind.INTEGRAL.problem.definite=Compute the integral of ${f} with respect to ${x} from ${lower} to ${upper}.
solution.status.DOES_NOT_EXIST.INTEGRAL=The integral diverges: it has no finite value.
rule.INT_DEFINITE_ANTIDERIVATIVE.title=Find an antiderivative
rule.INT_DEFINITE_ANTIDERIVATIVE.text=To use the fundamental theorem we need an antiderivative F of ${f}. We find it first, leaving out the constant of integration.
rule.INT_BARROW.title=Fundamental theorem of calculus
rule.INT_BARROW.text=Between ${p} and ${q}, the integral is F(${q}) − F(${p}) = ${Fq} − ${Fp}.
rule.INT_ADD_PIECES.title=Add the pieces
rule.INT_ADD_PIECES.text=The whole integral is the sum of the integrals of each piece.
rule.INT_ENDPOINT_LIMIT.title=Endpoint value with a limit
rule.INT_ENDPOINT_LIMIT.text=At ${a} the antiderivative cannot be evaluated directly, so we compute its limit as ${x} approaches ${a}.
rule.INT_IMPROPER.title=Improper integral
rule.INT_IMPROPER.text=There is an infinite endpoint or a point where the integrand is unbounded, so this is an improper integral. At those points we replace the value of the antiderivative by a limit.
rule.INT_SPLIT_SINGULARITY.title=Split at the singularity
rule.INT_SPLIT_SINGULARITY.text=The integrand is not defined at ${s}, which lies inside the interval. We split the integral there and treat each part as improper, with one-sided limits. If any part diverges, the whole integral diverges.
rule.INT_SPLIT_ABSOLUTE.title=Split where the absolute value changes
rule.INT_SPLIT_ABSOLUTE.text=The absolute value of ${g} changes its expression where ${g} = 0. We split the interval at those points and, on each piece, |${g}| is ${g} or −(${g}): we integrate each piece and add them.
rule.INT_ABSOLUTE_PIECE.title=A piece with no absolute value
rule.INT_ABSOLUTE_PIECE.text=Between ${p} and ${q}, ${g} has sign ${sign}, so |${g}| = ${h} and the integral is that of this piece.
rule.INT_DIVERGES.title=The integral diverges
rule.INT_DIVERGES.text=The limit of the antiderivative at ${a} is infinite or does not exist, so the integral has no finite value.
rule.INT_ODD_SYMMETRY.title=Odd symmetry
rule.INT_ODD_SYMMETRY.text=The integrand is odd and the interval is symmetric, from −${a} to ${a}: the areas on both sides cancel and the integral is 0.
rule.INT_EVEN_SYMMETRY.title=Even symmetry
rule.INT_EVEN_SYMMETRY.text=The integrand is even and the interval is symmetric, from −${a} to ${a}: the integral is twice the one from 0 to ${a}.
rule.INT_REVERSE_BOUNDS.title=Swap the endpoints
rule.INT_REVERSE_BOUNDS.text=The lower endpoint ${a} is greater than the upper one ${b}. Swapping them changes the sign of the integral.
rule.INT_EMPTY_INTERVAL.title=Equal endpoints
rule.INT_EMPTY_INTERVAL.text=Both endpoints are ${a}, so the interval has no length and the integral is 0.
rule.INT_P_TEST_INFINITY.title=The p-test at infinity
rule.INT_P_TEST_INFINITY.text=An integral of 1/x^p from ${a} to infinity, with ${a} > 0, converges if and only if p > 1. Here the integrand is a constant times 1/x^(${p}).
rule.INT_P_TEST_ZERO.title=The p-test at zero
rule.INT_P_TEST_ZERO.text=An integral of 1/x^p from 0 to ${b} converges if and only if p < 1. Here the integrand is a constant times 1/x^(${p}).
rule.INT_GAMMA.title=Gamma-type integral
rule.INT_GAMMA.text=An integral from 0 to infinity of x^p · e^(−k·x), with p = ${p} and k = ${k}, is the gamma function: it equals Γ(p + 1) / k^(p + 1). Γ(p + 1) is written p!, and here it gives ${value}.
rule.INT_GAMMA_LOG.title=Gamma-type integral with a logarithm
rule.INT_GAMMA_LOG.text=Differentiating the integral of x^s · e^(−k·x) with respect to the exponent brings down a factor ln x. So the integral from 0 to infinity of x^p · ln x · e^(−k·x), with p = ${p} and k = ${k}, is Γ(p + 1) / k^(p + 1) · (ψ(p + 1) − ln k), where ψ is the digamma function (the logarithmic derivative of Γ). Here it gives ${value}.
rule.INT_ASSUME_POSITIVE.title=Assume the parameter is positive
rule.INT_ASSUME_POSITIVE.text=The limit of the antiderivative at infinity depends on the sign of ${p}: the integral converges only if ${p} > 0 (otherwise it diverges or is undefined). We assume ${p} > 0 and the result holds for those values.
rule.INT_SPLIT_EXPONENT.title=Split the constant part of the exponent
rule.INT_SPLIT_EXPONENT.text=Since e^(a + b) = e^a · e^b, the part of the exponent that does not depend on ${x} comes out as a constant: e^(…) = ${c} · ${f}.
rule.INT_GAMMA_SCALE.title=Change of scale
rule.INT_GAMMA_SCALE.text=With u = ${k}·x, dx = du/${k} and x^p = u^p/${k}^p. The integral becomes 1/${k}^(p + 1) times the integral of u^p · e^(−u) from 0 to infinity, with p = ${p}.
rule.INT_GAMMA_DEFINITION.title=Definition of the gamma function
rule.INT_GAMMA_DEFINITION.text=By definition, the integral of u^p · e^(−u) from 0 to infinity is Γ(p + 1), written p! (it converges if p > −1). Here it is ${u}.
rule.INT_GAMMA_PARAMETER.title=Differentiate with respect to the exponent
rule.INT_GAMMA_PARAMETER.text=Let F(s) = the integral of x^s · e^(−${k}·x) from 0 to infinity, which equals Γ(s + 1)/${k}^(s + 1). Since the derivative of x^s with respect to s is x^s · ln x, the integral with ln x is F'(s), at s = ${p}.
rule.INT_GAMMA_DIGAMMA.title=Differentiate Γ with the digamma function
rule.INT_GAMMA_DIGAMMA.text=We have Γ'(z) = Γ(z)·ψ(z), where ψ is the digamma function, and the derivative of ${k}^(−(s + 1)) is −ln ${k} · ${k}^(−(s + 1)). So F'(s) = Γ(s + 1)/${k}^(s + 1) · (ψ(s + 1) − ln ${k}), and at s = ${p} it gives ${u}.
rule.INT_FORM_PARTIAL_FRACTIONS.title=Partial fractions
rule.INT_FORM_PARTIAL_FRACTIONS.text=We factor x² − a² = (x − a)(x + a), with a = ${a}, and split it into partial fractions: 1/(x² − a²) = 1/(2a) · (1/(x − a) − 1/(x + a)).
rule.INT_FORM_COMBINE_LOGS.title=Integrate each fraction and combine the logarithms
rule.INT_FORM_COMBINE_LOGS.text=The integral of 1/(x − a) is ln|x − a| and that of 1/(x + a) is ln|x + a|. We subtract and use ln A − ln B = ln(A/B).
rule.INT_FORM_TRIG_SUBSTITUTION.title=Trigonometric substitution
rule.INT_FORM_TRIG_SUBSTITUTION.text=With c = ${c}, we take x = √c·sin t. Then dx = √c·cos t dt and √(c − x²) = √c·cos t, so the integral becomes that of ${u} with respect to t.
rule.INT_FORM_COS_SQUARED.title=Integral of cos² t
rule.INT_FORM_COS_SQUARED.text=We use cos² t = (1 + cos 2t)/2: the integral of c·cos² t is (c/2)·(t + sin t·cos t).
rule.INT_FORM_BACK_SUBSTITUTION.title=Back to the original variable
rule.INT_FORM_BACK_SUBSTITUTION.text=With x = √c·sin t, t = arcsin(x/√c) and sin t·cos t = x·√(c − x²)/c. We substitute.
rule.INT_FORM_HYPERBOLIC_SUBSTITUTION.title=Hyperbolic substitution
rule.INT_FORM_HYPERBOLIC_SUBSTITUTION.text=With c = ${c}, we take x = √c·sinh t. Then dx = √c·cosh t dt and √(x² + c) = √c·cosh t, so the integral becomes that of ${u} with respect to t.
rule.INT_FORM_HYPERBOLIC_SQUARED.title=Integral of cosh² t
rule.INT_FORM_HYPERBOLIC_SQUARED.text=We use cosh² t = (1 + cosh 2t)/2: the integral of c·cosh² t is (c/2)·(t + sinh t·cosh t).
rule.INT_FORM_HYPERBOLIC_BACK.title=Back to the original variable
rule.INT_FORM_HYPERBOLIC_BACK.text=With x = √c·sinh t, t = ln|x + √(x² + c)| − ln √c and sinh t·cosh t = x·√(x² + c)/c. We substitute (the constant −ln √c is absorbed into the constant of integration).
rule.LIMIT_SPECIAL_VALUE.title=Values of the special functions
rule.LIMIT_SPECIAL_VALUE.text=With the value in place, the factorial and the digamma function are computed with exact numbers: n! = 1·2·…·n and ψ(n) = 1 + 1/2 + … + 1/(n − 1) − γ. Here ${u} = ${v}.
rule.LIMIT_LEADING_TERM.title=Leading term
rule.LIMIT_LEADING_TERM.text=For very large ${x}, a sum behaves like its highest-degree term: the others weigh less and less. Here ${before} behaves like ${after}.
rule.LIMIT_CONJUGATE_NUMERATOR.title=Multiply by the conjugate
rule.LIMIT_CONJUGATE_NUMERATOR.text=The numerator becomes (A − B)(A + B) = A² − B², with no roots.
rule.LIMIT_KNOWN_VALUE.title=Known value at infinity
rule.LIMIT_KNOWN_VALUE.text=When the argument tends to infinity, this function tends to a known value: ${u} → ${v}.
rule.LIMIT_DOMAIN_ONE_SIDE.title=The function exists on one side only
rule.LIMIT_DOMAIN_ONE_SIDE.text=On one side of ${a} the function is not defined in the reals (for example, the logarithm of a negative number), so the limit is the one computed from the other side.
rule.LIMIT_COMMON_BASE.title=Group powers with the same exponent
rule.LIMIT_COMMON_BASE.text=With the same exponent, a quotient of powers is the power of the quotient: a^x / b^x = (a/b)^x. This gives ${after}.
rule.LIMIT_DIVIDE_DOMINANT.title=Divide by the highest power
rule.LIMIT_DIVIDE_DOMINANT.text=We divide numerator and denominator by ${p}, the highest power of ${x} that appears. Bounded terms (like sin x) divided by something growing tend to 0. This gives ${after}.
rule.NESTED_INTEGRAL.title=Solve the inner integral first
rule.NESTED_INTEGRAL.text=The expression contains an integral of ${f} with respect to ${x}. We solve it separately, below, and use its value in what follows: ${value}.
rule.NESTED_DERIVATIVE.title=Solve the inner derivative first
rule.NESTED_DERIVATIVE.text=The expression contains the derivative of ${f} with respect to ${x}. We compute it separately and use its value in what follows: ${value}.
rule.NESTED_LIMIT.title=Solve the inner limit first
rule.NESTED_LIMIT.text=The expression contains the limit of ${f} as ${x} approaches ${a}. We compute it separately and use its value in what follows: ${value}.
solution.kind.DERIVATIVE.problem.partial=Differentiate ${f} partially with respect to ${vars}, in that order.
solution.kind.DERIVATIVE.problem.partialSingle=Differentiate ${f} partially with respect to ${x}.
rule.DIFF_PARTIAL.title=Partial derivative
rule.DIFF_PARTIAL.text=Derivative ${k} of ${n}: we differentiate with respect to ${x} and treat the other variables as constants.
solution.kind.INTEGRAL.problem.multiple=Compute the iterated integral of ${f} with respect to ${vars}, from the inside out.
rule.INT_ITERATED.title=Iterated integral
rule.INT_ITERATED.text=Integral ${k} of ${n}: we integrate with respect to ${x} and treat the other variables as constants.
rule.INT_ITERATED_DEFINITE.title=Iterated integral with limits
rule.INT_ITERATED_DEFINITE.text=Integral ${k} of ${n}: we integrate with respect to ${x} from ${lower} to ${upper}, treating the other variables as constants. The result may depend on the variables of the outer integrals.
solution.kind.LIMIT.problem.multiple=Compute the limit of ${f} as ${vars} approaches ${point}.
rule.LIMIT_MULTI_SUBSTITUTION.title=Function continuous at the point
rule.LIMIT_MULTI_SUBSTITUTION.text=Substituting the point ${a} gives a finite value, so the function is continuous there and the limit is that value.
rule.LIMIT_MULTI_ITERATED.title=Iterated limits
rule.LIMIT_MULTI_ITERATED.text=We take the limit in one variable and then in the other, in both orders: one gives ${one} and the other ${other}. If both exist and differ, the limit does not exist; if they agree, that proves nothing yet.
rule.LIMIT_MULTI_PATHS.title=Paths to the point
rule.LIMIT_MULTI_PATHS.text=We approach the point along different paths. Along ${one} the limit is ${oneValue}, but along ${other} it is ${otherValue}.
rule.LIMIT_MULTI_DIFFERENT.title=The limit does not exist
rule.LIMIT_MULTI_DIFFERENT.text=We found two ways of approaching the point with different results (${one} and ${other}). If the limit existed it would have to be the same along every path, so it does not exist.
rule.LIMIT_MULTI_POLAR_ZERO.title=Polar-coordinate bound
rule.LIMIT_MULTI_POLAR_ZERO.text=With u = r·cos θ and v = r·sin θ measured from the point, the numerator has order ${p} in r and the denominator order ${q}, and the leading part of the denominator has no zeros at any angle. Then |f| ≤ C·r^(${p}−${q}) and, since ${p} > ${q}, it tends to 0 as r tends to 0, along any path.
rule.LIMIT_MULTI_POLAR_INFINITE.title=Polar-coordinate bound: unbounded growth
rule.LIMIT_MULTI_POLAR_INFINITE.text=With u = r·cos θ and v = r·sin θ measured from the point, the numerator has order ${p} in r and the denominator order ${q}, and the leading parts of both have a fixed sign at every angle. Since ${p} < ${q}, |f| ≥ c·r^(${p}−${q}) grows without bound as r tends to 0, along any path.
rule.LIMIT_MULTI_CANCEL.title=Cancel the common factor
rule.LIMIT_MULTI_CANCEL.text=Numerator and denominator share a factor that vanishes at the point. We factor it and cancel it (away from the point the function does not change, and the limit does not depend on what happens at it): ${after}.
rule.LIMIT_MULTI_SQUEEZE.title=Bounded by something that tends to 0
rule.LIMIT_MULTI_SQUEEZE.text=The function is a product of ${g}, which is always between −1 and 1, and another part that tends to 0. Then |f| ≤ |other part| → 0 and the limit is 0, along any path.
rule.LIMIT_MULTI_INFINITESIMAL.title=Equivalent infinitesimal
rule.LIMIT_MULTI_INFINITESIMAL.text=Since ${g} tends to 0, sin(${g}) behaves like ${g} (sin u / u → 1). We replace it and get ${after}.
rule.LIMIT_MULTI_NEW_VARIABLE.title=Change of variable
rule.LIMIT_MULTI_NEW_VARIABLE.text=The whole expression depends on ${g}, which tends to ${a} as we approach the point. With u = ${g}, the limit is a one-variable one: ${after}.
rule.LIMIT_MULTI_POLAR_CONSTANT.title=Quotient of leading parts
rule.LIMIT_MULTI_POLAR_CONSTANT.text=In polar coordinates from the point, numerator and denominator both have order ${p} in r, the leading part of the denominator vanishes at no angle and the quotient of leading parts is constant. So the limit exists and equals that constant, along any path.
rule.LIMIT_MULTI_CANDIDATE.title=Not proven
rule.LIMIT_MULTI_CANDIDATE.text=Along the ${count} paths tried the limit is ${candidate}, but checking paths does not prove that the limit exists. A bound is missing (for example in polar coordinates, or the squeeze theorem). That is why it is not given as the result.

solution.kind.EQUATION.problem=Solve ${l} ${op} ${r} for ${x}.
solution.kind.INEQUALITY.problem=Solve the inequality ${l} ${op} ${r} for ${x}.
solution.kind.FACTORIZATION.problem=Factor ${f}.
solution.kind.EXPANSION.problem=Expand ${f}.

# ---- Algebra: equations, inequalities and polynomials
rule.ALG_MOVE_TO_ONE_SIDE.title=Move everything to one side
rule.ALG_MOVE_TO_ONE_SIDE.text=We move every term to one side to compare with zero: ${l} ${op} ${r}.

rule.ALG_SIMPLIFY.title=Combine like terms
rule.ALG_SIMPLIFY.text=We combine like terms: ${l} ${op} ${r}.

rule.ALG_ADD_TO_BOTH.title=Add to both sides
rule.ALG_ADD_TO_BOTH.text=We add ${t} to both sides: ${l} ${op} ${r}.

rule.ALG_MULTIPLY_BOTH.title=Multiply both sides
rule.ALG_MULTIPLY_BOTH.text=We multiply both sides by ${t}: ${l} ${op} ${r}.

rule.ALG_DIVIDE_BOTH.title=Divide both sides
rule.ALG_DIVIDE_BOTH.text=We divide both sides by ${t}: ${l} ${op} ${r}.

rule.ALG_MULTIPLY_BOTH_NEGATIVE.title=Multiply by a negative number
rule.ALG_MULTIPLY_BOTH_NEGATIVE.text=We multiply both sides by ${t}, which is negative, so the inequality reverses: ${l} ${op} ${r}.

rule.ALG_DIVIDE_BOTH_NEGATIVE.title=Divide by a negative number
rule.ALG_DIVIDE_BOTH_NEGATIVE.text=We divide both sides by ${t}, which is negative, so the inequality reverses: ${l} ${op} ${r}.

rule.ALG_ISOLATE.title=Isolate the unknown
rule.ALG_ISOLATE.text=We isolate ${x}: ${l} ${op} ${r}.

rule.ALG_IDENTITY.title=Always true
rule.ALG_IDENTITY.text=Both sides are equal for every value of ${x}, so the relation always holds.

rule.ALG_CONTRADICTION.title=Never true
rule.ALG_CONTRADICTION.text=What is left is ${l} ${op} ${r}, which is false for every value of ${x}: there is no solution.

rule.ALG_FACTOR.title=Factor
rule.ALG_FACTOR.text=We factor: ${f} = ${g}.

rule.ALG_ZERO_PRODUCT.title=Zero product property
rule.ALG_ZERO_PRODUCT.text=A product is zero only if one of its factors is zero. We set each factor to zero: ${list}.

rule.ALG_ZERO_FACTOR.title=Solve one factor
rule.ALG_ZERO_FACTOR.text=We solve ${l} ${op} ${r}.

rule.ALG_QUADRATIC_FORM.title=Standard form
rule.ALG_QUADRATIC_FORM.text=It is a quadratic equation a·${x}² + b·${x} + c = 0 with a = ${a}, b = ${b} and c = ${c}.

rule.ALG_DISCRIMINANT.title=Discriminant
rule.ALG_DISCRIMINANT.text=The discriminant is Δ = b² − 4ac = ${d}.

rule.ALG_DISCRIMINANT_POSITIVE.title=Two real solutions
rule.ALG_DISCRIMINANT_POSITIVE.text=Since Δ = ${d} is positive, there are two different real solutions.

rule.ALG_DISCRIMINANT_ZERO.title=One double solution
rule.ALG_DISCRIMINANT_ZERO.text=Since Δ = 0, there is a single (double) real solution.

rule.ALG_DISCRIMINANT_NEGATIVE.title=No real solutions
rule.ALG_DISCRIMINANT_NEGATIVE.text=Since Δ = ${d} is negative, the square root does not exist among the reals and there are no real solutions.

rule.ALG_QUADRATIC_FORMULA.title=Quadratic formula
rule.ALG_QUADRATIC_FORMULA.text=We apply x = (−b ± √(b² − 4ac)) / (2a) with a = ${a}, b = ${b} and c = ${c}.

rule.ALG_COMPLETE_SQUARE.title=Complete the square
rule.ALG_COMPLETE_SQUARE.text=We divide by ${a} and add ${k} = (b/2)² to both sides so the left side is a perfect square: ${l} ${op} ${r}.

rule.ALG_PERFECT_SQUARE_FORM.title=Write the square
rule.ALG_PERFECT_SQUARE_FORM.text=The left side is the square of a binomial: ${l} ${op} ${r}.

rule.ALG_SQUARE_ROOT.title=Square root on both sides
rule.ALG_SQUARE_ROOT.text=We take the square root of both sides, keeping both signs (±): ${l} ${op} ${r}.

rule.ALG_RATIONAL_ROOT_CANDIDATES.title=Rational root candidates
rule.ALG_RATIONAL_ROOT_CANDIDATES.text=If there is a rational root p/q, p divides ${a0} and q divides ${an}. The candidates are: ${list}.

rule.ALG_ROOT_FOUND.title=A root
rule.ALG_ROOT_FOUND.text=Testing ${r} the polynomial gives 0, so ${r} is a root and (${factor}) is a factor.

rule.ALG_SYNTHETIC_DIVISION.title=Synthetic division
rule.ALG_SYNTHETIC_DIVISION.text=We divide by (${factor}) with synthetic division and get the quotient ${q}.

rule.ALG_SUBSTITUTION.title=Substitution
rule.ALG_SUBSTITUTION.text=We substitute ${u} = ${e}: ${l} ${op} ${r}.

rule.ALG_BACK_SUBSTITUTION.title=Undo the substitution
rule.ALG_BACK_SUBSTITUTION.text=We go back to ${x} with ${u} = ${e}: ${l} ${op} ${r}.

rule.ALG_DOMAIN.title=Domain
rule.ALG_DOMAIN.text=The denominator cannot be zero: ${cond}.

rule.ALG_PARAMETERS.title=Letters as parameters
rule.ALG_PARAMETERS.text=We solve for ${x}; the other letters (${p}) are treated as fixed numbers.

rule.ALG_PARAM_NONZERO.title=Coefficient not zero
rule.ALG_PARAM_NONZERO.text=We assume ${a} is not zero: if it were, the equation would change degree and would need to be looked at separately.

rule.ALG_PARAM_REAL.title=When there are real solutions
rule.ALG_PARAM_REAL.text=The solutions are real only if ${d} ≥ 0.

rule.ALG_CLEAR_DENOMINATORS.title=Clear denominators
rule.ALG_CLEAR_DENOMINATORS.text=We multiply both sides by the common denominator ${d}: ${l} ${op} ${r}.

rule.ALG_NUMERATOR_ZERO.title=Numerator equals zero
rule.ALG_NUMERATOR_ZERO.text=A fraction is zero when its numerator is zero and its denominator is not: ${l} ${op} ${r}.

rule.ALG_ISOLATE_RADICAL.title=Isolate the radical
rule.ALG_ISOLATE_RADICAL.text=We leave the root alone on one side: ${l} ${op} ${r}.

rule.ALG_SQUARE_BOTH_SIDES.title=Square both sides
rule.ALG_SQUARE_BOTH_SIDES.text=We square both sides. This can add false solutions, so we will have to check: ${l} ${op} ${r}.

rule.ALG_CHECK_SOLUTIONS.title=Check the solutions
rule.ALG_CHECK_SOLUTIONS.text=We substitute each candidate in the original equation: ${list}.

rule.ALG_CHECK_VALID.title=Valid solution
rule.ALG_CHECK_VALID.text=With ${x} = ${v} both sides are equal, so it is a solution.

rule.ALG_CHECK_EXTRANEOUS.title=Extraneous solution
rule.ALG_CHECK_EXTRANEOUS.text=With ${x} = ${v} the two sides differ: it is an extraneous solution that appeared when squaring.

rule.ALG_ABS_CASES.title=Absolute value cases
rule.ALG_ABS_CASES.text=|a| = b means a = b or a = −b. With a = ${g} and b = ${h}, we solve both cases.

rule.ALG_ABS_NEGATIVE.title=Negative absolute value
rule.ALG_ABS_NEGATIVE.text=An absolute value is never negative, so ${l} ${op} ${r} has no solution.

rule.ALG_TAKE_LOG.title=Take logarithms
rule.ALG_TAKE_LOG.text=We take the natural logarithm of both sides to bring the exponent down: ${l} ${op} ${r}.

rule.ALG_TO_EXPONENTIAL.title=Exponential form
rule.ALG_TO_EXPONENTIAL.text=ln(a) = b is the same as a = e^b: ${l} ${op} ${r}.

rule.ALG_LOG_DOMAIN.title=Domain of the logarithm
rule.ALG_LOG_DOMAIN.text=The argument of a logarithm must be positive: ${cond}.

rule.ALG_TRIG_GENERAL.title=Solutions of a trigonometric equation
rule.ALG_TRIG_GENERAL.text=Trigonometric functions are periodic: besides the principal solution there are infinitely many more. With integer k: ${list}.

rule.ALG_TRIG_OUT_OF_RANGE.title=Out of range
rule.ALG_TRIG_OUT_OF_RANGE.text=Sine and cosine only take values between −1 and 1, and ${r} is outside: there is no solution.

rule.ALG_NUMERIC_ROOT.title=Find the root numerically
rule.ALG_NUMERIC_ROOT.text=There is no exact formula for this equation. We look for a root near ${x0} with bisection and refine it: ${x} ≈ ${v}.
rule.ALG_NUM_WHY_POLY.title=Why it cannot be solved for x
rule.ALG_NUM_WHY_POLY.text=It is a polynomial of degree ${n} with no rational roots. From degree 5 on there is no general formula with roots (Abel–Ruffini theorem), so ${x} cannot be isolated and has to be approximated.
rule.ALG_NUM_WHY_MIXED.title=Why it cannot be solved for x
rule.ALG_NUM_WHY_MIXED.text=The equation mixes terms of different kinds (${kinds}) in ${x}: what would undo one term spoils the other, and no isolating operation leaves ${x} alone. There is no exact solution in elementary functions, so it has to be approximated.
rule.ALG_NUM_WHY_GENERIC.title=Why it cannot be solved for x
rule.ALG_NUM_WHY_GENERIC.text=No solving method (linear, quadratic, factoring, radicals, logarithms…) solves this equation in ${x}, so we study the function and approximate the solution.
rule.ALG_NUM_DOMAIN.title=Domain
rule.ALG_NUM_DOMAIN.text=Because of the logarithms we must impose ${conditions}. Therefore ${domain}: solutions can only exist there.
rule.ALG_NUM_FUNCTION.title=Define the function
rule.ALG_NUM_FUNCTION.text=Let f(${x}) = ${f}. Solving the equation means finding the values of ${x} with f(${x}) = 0.
rule.ALG_NUM_MONOTONE.title=Study the monotonicity
rule.ALG_NUM_MONOTONE.text=We differentiate: f'(${x}) = ${d}. This derivative has a fixed sign on the whole domain, so f is strictly increasing.
rule.ALG_NUM_MONOTONE_TERMS.title=Study the monotonicity
rule.ALG_NUM_MONOTONE_TERMS.text=We differentiate: f'(${x}) = ${d}. On the whole domain every term has the same sign: ${parts}. So the derivative never vanishes and f is strictly increasing.
rule.ALG_NUM_MONOTONE_DOWN.title=Study the monotonicity
rule.ALG_NUM_MONOTONE_DOWN.text=We differentiate: f'(${x}) = ${d}. This derivative is negative on the whole domain, so f is strictly decreasing.
rule.ALG_NUM_MONOTONE_TERMS_DOWN.title=Study the monotonicity
rule.ALG_NUM_MONOTONE_TERMS_DOWN.text=We differentiate: f'(${x}) = ${d}. On the whole domain every term is negative: ${parts}. So the derivative never vanishes and f is strictly decreasing.
rule.ALG_NUM_LIMITS.title=Analyze the limits
rule.ALG_NUM_LIMITS.text=At the left end (${leftPoint}), f(${x}) tends to ${left}; at the right end (${rightPoint}), it tends to ${right}.
rule.ALG_NUM_EXISTENCE_ONE.title=Existence and uniqueness
rule.ALG_NUM_EXISTENCE_ONE.text=f is continuous on the domain, strictly monotonic and changes sign between the two ends. By Bolzano's theorem there is at least one root, and being monotonic it is unique.
rule.ALG_NUM_EXISTENCE_NONE.title=Existence and uniqueness
rule.ALG_NUM_EXISTENCE_NONE.text=f is continuous and strictly monotonic, but it does not change sign between the ends: there is no real root.
rule.ALG_NUM_BRACKET.title=Bracket the root
rule.ALG_NUM_BRACKET.text=We evaluate: f(${a}) ≈ ${fa} and f(${b}) ≈ ${fb}. Since they have different signs, the root lies between ${a} and ${b}.
rule.ALG_NUM_CHECK.title=Check
rule.ALG_NUM_CHECK.text=With ${x} ≈ ${v}, f(${v}) ≈ ${fv}, which is practically 0.

rule.ALG_NUMERIC_TOO_MANY.title=Too many solutions
rule.ALG_NUMERIC_TOO_MANY.text=${f} changes sign more than ${n} times between −50 and 50: there are too many solutions (probably infinitely many) to list one by one. The set is given as the condition its elements satisfy.

rule.ALG_NUMERIC_SAMPLES.title=Some example roots
rule.ALG_NUMERIC_SAMPLES.text=The ones closest to the origin, with ${f} = 0, are approximately: ${list}.

rule.INEQ_CRITICAL_POINTS.title=Critical points
rule.INEQ_CRITICAL_POINTS.text=The expression can only change sign at the roots of the numerator and where it is undefined: ${list}.

rule.INEQ_SIGN_TEST.title=Test a value
rule.INEQ_SIGN_TEST.text=In ${interval} we test ${t}: the expression gives ${v}, so its sign is ${sign}.

rule.INEQ_ENDPOINTS_INCLUDED.title=Included endpoints
rule.INEQ_ENDPOINTS_INCLUDED.text=Since the symbol ${op} allows equality, the points where the expression is zero (${list}) are part of the solution.
rule.INEQ_ENDPOINTS_EXCLUDED.title=Excluded endpoints
rule.INEQ_ENDPOINTS_EXCLUDED.text=The points ${list} are not part of the solution: either the symbol ${op} does not allow equality or the expression is not defined there.
rule.INEQ_OUT_OF_DOMAIN.title=Outside the domain
rule.INEQ_OUT_OF_DOMAIN.text=In ${interval} the expression is not defined, so there is no solution there.

rule.INEQ_ABS_CASES.title=Absolute value in an inequality
rule.INEQ_ABS_CASES.text=${l} ${op} ${r} is equivalent to ${cases}.

rule.INEQ_ALWAYS.title=Always true
rule.INEQ_ALWAYS.text=The inequality ${l} ${op} ${r} holds for every value in the domain.

rule.INEQ_NEVER.title=Never true
rule.INEQ_NEVER.text=The inequality ${l} ${op} ${r} does not hold for any value.

rule.INEQ_COLLECT.title=Collect the intervals
rule.INEQ_COLLECT.text=We collect the intervals where ${l} ${op} ${r} holds.

rule.POLY_COMMON_FACTOR.title=Common factor
rule.POLY_COMMON_FACTOR.text=We take out the common factor ${g}: ${f} = ${g}·(${rest}).

rule.POLY_DIFF_SQUARES.title=Difference of squares
rule.POLY_DIFF_SQUARES.text=a² − b² = (a − b)(a + b), with a = ${a} and b = ${b}: ${f} = ${g}.

rule.POLY_PERFECT_SQUARE.title=Perfect square trinomial
rule.POLY_PERFECT_SQUARE.text=With a = ${a} and b = ${b}, the middle term ${m} is ±2ab, so ${f} = ${g}.

rule.POLY_SUM_CUBES.title=Sum of cubes
rule.POLY_SUM_CUBES.text=a³ + b³ = (a + b)(a² − ab + b²), with a = ${a} and b = ${b}: ${f} = ${g}.

rule.POLY_DIFF_CUBES.title=Difference of cubes
rule.POLY_DIFF_CUBES.text=a³ − b³ = (a − b)(a² + ab + b²), with a = ${a} and b = ${b}: ${f} = ${g}.

rule.POLY_TRINOMIAL_NUMBERS.title=Two numbers with a given sum and product
rule.POLY_TRINOMIAL_NUMBERS.text=We look for two numbers that add up to ${b} and multiply to ${ac}: they are ${m} and ${n}.

rule.POLY_TRINOMIAL_SPLIT.title=Split the middle term
rule.POLY_TRINOMIAL_SPLIT.text=We write the middle term as a sum: ${f} = ${g}.

rule.POLY_GROUPING.title=Grouping
rule.POLY_GROUPING.text=We group the terms in pairs and take out the common factor of each group: ${g}.

rule.POLY_COMMON_BINOMIAL.title=Common binomial factor
rule.POLY_COMMON_BINOMIAL.text=Both groups share the factor ${b}, which we take out: ${f} = ${g}.

rule.POLY_QUADRATIC_ROOTS.title=Factor with the roots
rule.POLY_QUADRATIC_ROOTS.text=The roots are ${r1} and ${r2}, and a·(x − r₁)(x − r₂) with a = ${a} gives ${f} = ${g}.

rule.POLY_COMPLETE_SQUARE.title=Complete the square
rule.POLY_COMPLETE_SQUARE.text=We add and subtract ${k} to form a perfect square: ${f} = ${g}.

rule.POLY_SUBSTITUTION.title=Substitution
rule.POLY_SUBSTITUTION.text=Since only powers of ${x}^${k} appear, we set ${u} = ${e} and factor ${p}.

rule.POLY_IRREDUCIBLE.title=Cannot be factored
rule.POLY_IRREDUCIBLE.text=${f} cannot be factored over the rationals with this method.

rule.POLY_NOT_APPLICABLE.title=Method not applicable
rule.POLY_NOT_APPLICABLE.text=This method does not work for ${f}.

rule.POLY_DISTRIBUTE.title=Distributive property
rule.POLY_DISTRIBUTE.text=We multiply each term of one factor by each term of the other: ${f} = ${g}.

rule.POLY_BINOMIAL.title=Binomial theorem
rule.POLY_BINOMIAL.text=(a + b)ⁿ = Σ C(n, k)·aⁿ⁻ᵏ·bᵏ, with a = ${a}, b = ${b} and n = ${n}: ${f} = ${g}.

rule.POLY_MULTINOMIAL.title=Multinomial theorem
rule.POLY_MULTINOMIAL.text=Each term has the coefficient n!/(k₁!·k₂!···) with k₁ + k₂ + ··· = ${n}: ${f} = ${g}.

rule.POLY_COLLECT.title=Combine like terms
rule.POLY_COLLECT.text=We combine the terms with the same powers: ${f} = ${g}.

rule.POLY_RESULT.title=Result
rule.POLY_RESULT.text=${f} = ${g}.

# ---- Factoring methods
method.factor.AUTO.title=Automatic
method.factor.AUTO.desc=Tries the methods in order until the expression is fully factored.
method.factor.COMMON_FACTOR.title=Common factor
method.factor.COMMON_FACTOR.desc=Works when every term shares a number or a variable.
method.factor.DIFFERENCE_OF_SQUARES.title=Difference of squares
method.factor.DIFFERENCE_OF_SQUARES.desc=Works for a² − b²: it factors as (a − b)(a + b).
method.factor.PERFECT_SQUARE.title=Perfect square trinomial
method.factor.PERFECT_SQUARE.desc=Works for a² ± 2ab + b²: it is the square of a binomial.
method.factor.SUM_DIFFERENCE_OF_CUBES.title=Sum or difference of cubes
method.factor.SUM_DIFFERENCE_OF_CUBES.desc=Works for a³ ± b³.
method.factor.TRINOMIAL.title=Trinomial ax² + bx + c
method.factor.TRINOMIAL.desc=Looks for two numbers that add up to b and multiply to ac, then groups.
method.factor.GROUPING.title=Grouping
method.factor.GROUPING.desc=Works with four terms that can be grouped in pairs with a common factor.
method.factor.RATIONAL_ROOTS.title=Rational roots (synthetic division)
method.factor.RATIONAL_ROOTS.desc=Finds rational roots with the rational root theorem and divides synthetically.
method.factor.QUADRATIC_FORMULA.title=Quadratic formula
method.factor.QUADRATIC_FORMULA.desc=For ax² + bx + c with a non-negative discriminant: uses the roots, a(x − r₁)(x − r₂).
method.factor.COMPLETE_SQUARE.title=Completing the square
method.factor.COMPLETE_SQUARE.desc=For ax² + bx + c with a non-negative discriminant: turns it into a difference of squares.
method.factor.SUBSTITUTION.title=Substitution
method.factor.SUBSTITUTION.desc=Works when only powers of x^k appear (for example x⁴ − 5x² + 4).

rule.ALG_OTHER_SOLUTION.title=The other solution
rule.ALG_OTHER_SOLUTION.text=With the opposite sign we get the other solution: ${l} ${op} ${r}.
rule.ALG_RAISE_BOTH_SIDES.title=Raise to a power
rule.ALG_RAISE_BOTH_SIDES.text=We raise both sides to the power ${n} to remove the root: ${l} ${op} ${r}.

# ---- Equation solving methods
method.solve.AUTO.title=Automatic
method.solve.AUTO.desc=Picks the most natural method for this kind of equation.
method.solve.ISOLATE.title=Isolate
method.solve.ISOLATE.desc=First-degree equation: move terms around and divide.
method.solve.FACTORING.title=Factoring
method.solve.FACTORING.desc=Factor the expression and set each factor to zero.
method.solve.SQUARE_ROOT.title=Square root
method.solve.SQUARE_ROOT.desc=Works for x² = k, with no x term.
method.solve.COMPLETE_SQUARE.title=Completing the square
method.solve.COMPLETE_SQUARE.desc=Turns the left side into a perfect square and takes the root.
method.solve.QUADRATIC_FORMULA.title=Quadratic formula
method.solve.QUADRATIC_FORMULA.desc=Works for any quadratic equation.
method.solve.RATIONAL_ROOTS.title=Rational roots (synthetic division)
method.solve.RATIONAL_ROOTS.desc=Tests the possible rational roots and divides the polynomial.
method.solve.SUBSTITUTION.title=Substitution
method.solve.SUBSTITUTION.desc=Works when only powers of x^k appear, or a repeated exponential or trigonometric function.
method.solve.ZERO_NUMERATOR.title=Numerator equals zero
method.solve.ZERO_NUMERATOR.desc=Equation with fractions: the numerator is zero and the denominator is not.
method.solve.ISOLATE_RADICAL.title=Isolate the radical
method.solve.ISOLATE_RADICAL.desc=Leave the root alone, raise to a power and check the solutions.
method.solve.ABSOLUTE_CASES.title=Absolute value cases
method.solve.ABSOLUTE_CASES.desc=Solve each sign of the absolute value separately.
method.solve.LOGARITHMS.title=Logarithms and exponentials
method.solve.LOGARITHMS.desc=Take logarithms or switch to exponential form.
method.solve.INVERSE_TRIG.title=Inverse trigonometric functions
method.solve.INVERSE_TRIG.desc=Uses the inverse function and periodicity.
method.solve.NUMERIC.title=Numerical
method.solve.NUMERIC.desc=Finds the roots by successive approximation when there is no formula.
method.solve.SIGN_CHART.title=Sign chart
method.solve.SIGN_CHART.desc=Finds the points where the expression changes sign and checks the sign on each interval.

rule.DIFF_EXPAND_FIRST.title=Expand before differentiating
rule.DIFF_EXPAND_FIRST.text=First we expand ${f} = ${g} and differentiate term by term.

rule.DIFF_SIMPLIFY_FIRST.title=Simplify before differentiating
rule.DIFF_SIMPLIFY_FIRST.text=First we combine and simplify the fraction: ${f} = ${g}. Then we differentiate.

rule.DIFF_QUOTIENT_AS_PRODUCT.title=Quotient as a product
rule.DIFF_QUOTIENT_AS_PRODUCT.text=Instead of the quotient rule, we write ${f} as a product with the denominator raised to −1 and use the product rule and the chain rule.

rule.DIFF_LOGARITHMIC.title=Logarithmic differentiation
rule.DIFF_LOGARITHMIC.text=If y = ${f}, we take logarithms: ln y = ${g}. We differentiate both sides and solve y' = y·(ln y)'.

# ---- Differentiation and integration methods
method.derivative.AUTO.title=Direct
method.derivative.AUTO.desc=Applies the differentiation rules as they appear in the expression.
method.derivative.EXPAND_FIRST.title=Expand first
method.derivative.EXPAND_FIRST.desc=Expands products and powers of sums and differentiates term by term.
method.derivative.SIMPLIFY_FIRST.title=Simplify first
method.derivative.SIMPLIFY_FIRST.desc=Combines fractions and cancels common factors before differentiating.
method.derivative.QUOTIENT_AS_PRODUCT.title=Quotient as a product
method.derivative.QUOTIENT_AS_PRODUCT.desc=Avoids the quotient rule: uses product and chain with the denominator to the power −1.
method.derivative.LOGARITHMIC.title=Logarithmic differentiation
method.derivative.LOGARITHMIC.desc=Takes logarithms and differentiates ln f; good for long products and variable exponents.
method.integral.AUTO.title=Automatic
method.integral.AUTO.desc=Tries the techniques in order and uses the first that works.
method.integral.LINEARITY.title=Linearity
method.integral.LINEARITY.desc=Integrates a sum term by term or takes out a constant factor.
method.integral.TABLE.title=Integral table
method.integral.TABLE.desc=It is an immediate integral from the table.
method.integral.SUBSTITUTION.title=Substitution
method.integral.SUBSTITUTION.desc=Changes variable with u = g(x) when g'(x) appears as a factor.
method.integral.BY_PARTS.title=Integration by parts
method.integral.BY_PARTS.desc=∫u dv = uv − ∫v du, choosing u with the LIATE rule.
method.integral.PARTIAL_FRACTIONS.title=Partial fractions
method.integral.PARTIAL_FRACTIONS.desc=Splits a fraction of polynomials into simpler fractions.
method.integral.TRIGONOMETRIC.title=Trigonometric identities
method.integral.TRIGONOMETRIC.desc=Powers of sine and cosine, half angle and product to sum.
method.integral.RADICAL.title=Radicals
method.integral.RADICAL.desc=Substitutes the root, completes the square or uses a trigonometric substitution.
method.integral.COMPLETE_SQUARE.title=Completing the square
method.integral.COMPLETE_SQUARE.desc=With a quadratic denominator: writes it as a sum of squares and uses arctangent or logarithm.
method.integral.REDUCTION.title=Reduction formulas
method.integral.REDUCTION.desc=Lowers the power step by step with a reduction formula.
method.integral.POLYNOMIAL_DIVISION.title=Polynomial division
method.integral.POLYNOMIAL_DIVISION.desc=Divides numerator by denominator to separate a polynomial and a proper fraction.
method.integral.EXPAND.title=Expand
method.integral.EXPAND.desc=Expands products and powers and integrates term by term.

solution.kind.REWRITE.problem=Rewrite ${f} replacing ${p} with ${q}.

rule.POLY_REWRITE.title=Replace a pattern
rule.POLY_REWRITE.text=We look for the parts of the expression that have the form ${p} and replace them with ${q}.
solution.title=Step-by-step solution
solution.problem=Problem
solution.kind.SERIES.problem=Decide whether the series with general term ${f} converges, with ${x} from ${lower}.
solution.kind.TAYLOR.problem=Expand ${f} as a Taylor series around ${x} = ${a}, up to degree ${degree}.
solution.kind.LAURENT.problem=Expand ${f} as a Laurent series around ${x} = ${a}, up to the power ${degree}.
solution.kind.FOURIER.problem=Expand ${f} as a Fourier series on the interval from ${lower} to ${upper}, with ${harmonics} harmonics.
solution.status.NON_ELEMENTAL.SERIES=The series converges, but I cannot write its sum.
solution.status.DOES_NOT_EXIST.SERIES=The series diverges.
solution.status.UNSOLVED.SERIES=No test decides whether the series converges.
rule.SERIES_TERM.title=The series
rule.SERIES_TERM.text=We study the series with general term ${f}, with ${x} from ${lower}. The tests are applied in order: d'Alembert's ratio, Cauchy's root, the necessary condition, comparison, the integral and, if the signs alternate, Leibniz.
rule.SERIES_ALTERNATING.title=Alternating signs
rule.SERIES_ALTERNATING.text=The factor (−1) raised to an expression of ${x} makes the signs alternate. For absolute convergence we study the absolute values, ${g}.
rule.SERIES_RATIO.title=Ratio test (d'Alembert)
rule.SERIES_RATIO.text=If the limit L of the ratio of a term to the previous one is less than 1, the series converges; if it is greater than 1, it diverges. The ratio of ${f} to its next term is ${r}, and its limit as ${x} → ∞ is L.
rule.SERIES_RATIO_CONVERGES.title=Converges by the ratio test
rule.SERIES_RATIO_CONVERGES.text=Since L = ${L} is less than 1, the series converges, and it does so absolutely.
rule.SERIES_RATIO_DIVERGES.title=Diverges by the ratio test
rule.SERIES_RATIO_DIVERGES.text=Since L = ${L} is greater than 1, the terms do not tend to 0 and the series diverges.
rule.SERIES_RATIO_INCONCLUSIVE.title=The ratio test does not decide
rule.SERIES_RATIO_INCONCLUSIVE.text=The ratio gives no limit below or above 1 (it is 1, or it could not be computed), so nothing can be concluded. We try the root test.
rule.SERIES_ROOT.title=Root test (Cauchy)
rule.SERIES_ROOT.text=If the limit L of the n-th root of the term is less than 1, the series converges; if it is greater than 1, it diverges. The n-th root of ${f} is ${r}, and its limit as ${x} → ∞ is L.
rule.SERIES_ROOT_CONVERGES.title=Converges by the root test
rule.SERIES_ROOT_CONVERGES.text=Since L = ${L} is less than 1, the series converges, and it does so absolutely.
rule.SERIES_ROOT_DIVERGES.title=Diverges by the root test
rule.SERIES_ROOT_DIVERGES.text=Since L = ${L} is greater than 1, the terms do not tend to 0 and the series diverges.
rule.SERIES_ROOT_INCONCLUSIVE.title=The root test does not decide
rule.SERIES_ROOT_INCONCLUSIVE.text=The root gives no limit below or above 1 (it is 1, or it could not be computed), so nothing can be concluded. We go on with the necessary condition and comparison.
rule.SERIES_GEOMETRIC_SUM.title=Geometric series
rule.SERIES_GEOMETRIC_SUM.text=The ratio of two consecutive terms is the constant ${r}, with absolute value less than 1: this is a geometric series. Its sum is the first term, ${a}, divided by 1 − ${r}.
rule.SERIES_NTH_TERM.title=Necessary condition
rule.SERIES_NTH_TERM.text=If the series converges, its general term tends to 0. The limit of ${f} as ${x} → ∞ is the value of the step.
rule.SERIES_NTH_DIVERGES.title=Diverges: the term does not tend to 0
rule.SERIES_NTH_DIVERGES.text=The limit of the term is ${L}, which is not 0, so the series diverges.
rule.SERIES_NTH_ZERO.title=The term tends to 0
rule.SERIES_NTH_ZERO.text=The limit of the term is ${L}: the necessary condition holds, but it is not enough to conclude.
rule.SERIES_BOUNDED.title=Comparison with a bound
rule.SERIES_BOUNDED.text=Sine and cosine are bounded by 1, so the absolute value of ${f} does not exceed ${g}. Since the series of ${g} converges, so does the series of absolute values, and the series with it.
rule.SERIES_BOUNDED_INCONCLUSIVE.title=The bound does not decide
rule.SERIES_BOUNDED_INCONCLUSIVE.text=Bounding sine and cosine by 1 gives ${g}, but that series is not known to converge, and a bound that diverges says nothing about the term.
rule.SERIES_COMPARE_CONVERGES.title=Comparison with the series 1/n^p
rule.SERIES_COMPARE_CONVERGES.text=We compare ${f} with ${g}, the p-series with p = ${p}. The limit of their quotient is ${L}. Since p is greater than 1, the p-series converges, and ${f} converges with it.
rule.SERIES_COMPARE_DIVERGES.title=Comparison with the series 1/n^p
rule.SERIES_COMPARE_DIVERGES.text=We compare ${f} with ${g}, the p-series with p = ${p}. The limit of their quotient is ${L}. Since p is not greater than 1, the p-series diverges, and ${f} diverges with it.
rule.SERIES_INTEGRAL.title=Integral test
rule.SERIES_INTEGRAL.text=The terms of ${f} are positive and decreasing, so the series and the integral of ${f} from ${lower} to infinity behave alike. We compute the integral.
rule.SERIES_INTEGRAL_CONVERGES.title=The integral converges
rule.SERIES_INTEGRAL_CONVERGES.text=The integral equals ${I}, a finite number: the series converges.
rule.SERIES_INTEGRAL_DIVERGES.title=The integral diverges
rule.SERIES_INTEGRAL_DIVERGES.text=The integral has no finite value: the series of ${f} diverges.
rule.SERIES_LEIBNIZ.title=Leibniz test
rule.SERIES_LEIBNIZ.text=In an alternating series, if the absolute values ${f} decrease and tend to 0, the series converges.
rule.SERIES_LEIBNIZ_CONVERGES.title=Converges by Leibniz
rule.SERIES_LEIBNIZ_CONVERGES.text=The absolute values decrease and tend to 0: the series converges.
rule.SERIES_LEIBNIZ_FAILS.title=Leibniz does not hold
rule.SERIES_LEIBNIZ_FAILS.text=The absolute values do not decrease or do not tend to 0 (or this could not be checked), so the test does not decide.
rule.SERIES_CONCLUSION_CONVERGES.title=The series converges
rule.SERIES_CONCLUSION_CONVERGES.text=The series with general term ${f} converges.
rule.SERIES_CONCLUSION_ABSOLUTE.title=The series converges absolutely
rule.SERIES_CONCLUSION_ABSOLUTE.text=The series with general term ${f} converges, and so does the series of its absolute values.
rule.SERIES_CONCLUSION_CONDITIONAL.title=The series converges conditionally
rule.SERIES_CONCLUSION_CONDITIONAL.text=The series with general term ${f} converges, but the series of its absolute values diverges.
rule.SERIES_CONCLUSION_DIVERGES.title=The series diverges
rule.SERIES_CONCLUSION_DIVERGES.text=The series with general term ${f} diverges.
rule.SERIES_CONCLUSION_UNDECIDED.title=No conclusion
rule.SERIES_CONCLUSION_UNDECIDED.text=None of the tests decides whether the series with general term ${f} converges.
rule.SERIES_CONCLUSION_UNDECIDED_ABSOLUTE.title=No conclusion
rule.SERIES_CONCLUSION_UNDECIDED_ABSOLUTE.text=The series of absolute values diverges and Leibniz does not hold: we cannot decide whether the alternating series with term ${f} converges.
rule.TAYLOR_FORMULA.title=Taylor series
rule.TAYLOR_FORMULA.text=The Taylor series of ${f} around ${x} = ${a} is the sum of f⁽ᵏ⁾(a)/k! · (x − a)ᵏ. We compute the coefficients up to k = ${N}.
rule.TAYLOR_DERIVATIVE.title=Next derivative
rule.TAYLOR_DERIVATIVE.text=We differentiate to get the derivative of order ${k}.
rule.TAYLOR_COEFFICIENT.title=Coefficient of order k
rule.TAYLOR_COEFFICIENT.text=At ${x} = ${a}, the derivative of order ${k} equals ${v}; divided by k! it is the coefficient of (x − a)ᵏ.
rule.TAYLOR_RESULT.title=The expansion
rule.TAYLOR_RESULT.text=Adding the terms up to degree ${N} gives the Taylor polynomial.
rule.LAURENT_FORMULA.title=Laurent series
rule.LAURENT_FORMULA.text=The Laurent series of ${f} around ${x} = ${a} allows negative powers of (x − a). We look for the order m of the pole, the smallest m with (x − a)ᵐ·f finite at ${a}; then we expand that function and divide by (x − a)ᵐ.
rule.LAURENT_REGULAR_POINT.title=Regular point
rule.LAURENT_REGULAR_POINT.text=${f} has a finite limit at ${a}: there is no singular part and the Laurent expansion is the Taylor one.
rule.LAURENT_RESULT.title=The expansion
rule.LAURENT_RESULT.text=The terms from the power −m up to (x − a)^${N} make up the Laurent expansion.
rule.FOURIER_PERIOD.title=Period and frequency
rule.FOURIER_PERIOD.text=On the interval from ${lower} to ${upper} the period is T = ${T} and the frequency is ω = ${w}. The series is a₀/2 + Σ (aₖ cos kωx + bₖ sin kωx), with aₖ = 2/T ∫ f cos kωx dx and bₖ = 2/T ∫ f sin kωx dx. We compute up to k = ${N}.
rule.FOURIER_EVEN.title=Even function
rule.FOURIER_EVEN.text=${f} is even on a symmetric interval: every bₖ is 0.
rule.FOURIER_ODD.title=Odd function
rule.FOURIER_ODD.text=${f} is odd on a symmetric interval: a₀ and every aₖ are 0.
rule.FOURIER_A0.title=Coefficient a₀
rule.FOURIER_A0.text=a₀ is twice the mean of ${f} on the interval: 2/T times its integral.
rule.FOURIER_AN.title=Coefficient aₖ
rule.FOURIER_AN.text=For k = ${k}, aₖ is 2/T times the integral of ${f} multiplied by ${g}.
rule.FOURIER_BN.title=Coefficient bₖ
rule.FOURIER_BN.text=For k = ${k}, bₖ is 2/T times the integral of ${f} multiplied by ${g}.
rule.FOURIER_RESULT.title=The series
rule.FOURIER_RESULT.text=Adding the harmonics up to k = ${N} gives the Fourier series.
rule.LAURENT_ESSENTIAL.title=It cannot be expanded this way
rule.LAURENT_ESSENTIAL.text=We could not expand the numerator and the denominator of ${f} around ${a} as power series in (x − a): it is not a quotient of regular functions at that point (it may be an essential singularity).
rule.LAURENT_POLE.title=Order of the pole
rule.LAURENT_POLE.text=The numerator of ${f} vanishes at ${a} with order ${p} and the denominator with order ${q}: the difference, ${m}, is the order of the pole.
rule.EXPANSION_QUOTIENT.title=Quotient of series
rule.EXPANSION_QUOTIENT.text=${f} is the quotient of ${n} by ${d}. We expand each around ${a} as a power series in (x − a) and then divide the series.
rule.EXPANSION_DIVIDE.title=Divide the series
rule.EXPANSION_DIVIDE.text=We divide the numerator's series by the denominator's: each coefficient of the quotient comes from solving «numerator = denominator · quotient», starting with the lowest power.

# ---- Ecuaciones diferenciales
solution.kind.ODE.problem=Solve the differential equation ${l} ${op} ${r}.
solution.kind.ODE.problem.order=Solve the differential equation of order ${k}: ${l} ${op} ${r}.
solution.kind.ODE.problem.system=Solve the system of differential equations ${l}.
rule.ODE_INTEGRAL.title=Integrate
rule.ODE_INTEGRAL.text=We integrate ${f} with respect to ${x}, below.
rule.ODE_SEPARATE.title=Separate the variables
rule.ODE_SEPARATE.text=The equation is separable: y' = g(x)·h(y), with g = ${g} and h = ${h}. We move everything with ${y} to one side and everything with ${x} to the other: ${l} ${op} ${r}.
rule.ODE_INTEGRATE_SIDES.title=Integrate both sides
rule.ODE_INTEGRATE_SIDES.text=We integrate each side (the one with ${y} with respect to ${y}, the other with respect to ${x}) and add the constant of integration C: ${l} ${op} ${r}.
rule.ODE_ISOLATE.title=Solve for the function
rule.ODE_ISOLATE.text=We solve for ${y}; the constant C absorbs the signs and the positive factors: ${l} ${op} ${r}.
rule.ODE_LINEAR_FORM.title=Linear equation
rule.ODE_LINEAR_FORM.text=It is linear: we write it as y' + P(x)·y = Q(x), with P = ${P} and Q = ${Q}: ${l} ${op} ${r}.
rule.ODE_INTEGRATING_FACTOR.title=Integrating factor
rule.ODE_INTEGRATING_FACTOR.text=The integrating factor is μ = e^(∫P dx) = ${mu}.
rule.ODE_MULTIPLY_FACTOR.title=Multiply by the integrating factor
rule.ODE_MULTIPLY_FACTOR.text=We multiply the equation by μ = ${mu}: ${l} ${op} ${r}. The left side is exactly the derivative of μ·${y}.
rule.ODE_LINEAR_INTEGRATE.title=Integrate
rule.ODE_LINEAR_INTEGRATE.text=Since (μ·y)' = μ·Q, we integrate μ·Q = ${f} with respect to ${x}: ${l} ${op} ${r}.
rule.ODE_EXACT_FORM.title=Differential form
rule.ODE_EXACT_FORM.text=We write the equation as M dx + N dy = 0, with M = ${M} and N = ${N}.
rule.ODE_EXACT_TEST.title=Check that it is exact
rule.ODE_EXACT_TEST.text=It is exact when ∂M/∂y = ∂N/∂x, and it holds here: ${l} ${op} ${r}.
rule.ODE_NOT_EXACT.title=Not exact
rule.ODE_NOT_EXACT.text=∂M/∂y = ${My} and ∂N/∂x = ${Nx} differ, but the quotient built from their difference depends only on ${v}: ${h}. It gives an integrating factor.
rule.ODE_EXACT_FACTOR.title=Integrating factor
rule.ODE_EXACT_FACTOR.text=We multiply by μ = ${mu} and the equation becomes exact: ${l} ${op} ${r}.
rule.ODE_EXACT_POTENTIAL.title=Potential function
rule.ODE_EXACT_POTENTIAL.text=We look for F with ∂F/∂x = M. Integrating M with respect to ${x} gives ${l} ${op} ${r}, where g is a function of ${y}.
rule.ODE_EXACT_FIND_G.title=Find g
rule.ODE_EXACT_FIND_G.text=We differentiate F with respect to ${y} and set it equal to N: so ${l} ${op} ${r}.
rule.ODE_EXACT_RESULT.title=Implicit solution
rule.ODE_EXACT_RESULT.text=The solution is F(x, y) = C: ${l} ${op} ${r}.
rule.ODE_HOMOGENEOUS_TEST.title=Homogeneous equation
rule.ODE_HOMOGENEOUS_TEST.text=Since f(tx, ty) = f(x, y), it depends only on ${v} = ${y}/${x}: ${l} ${op} ${r}.
rule.ODE_HOMOGENEOUS_SUBSTITUTION.title=Substitution y = v·x
rule.ODE_HOMOGENEOUS_SUBSTITUTION.text=With y = ${v}·${x} we get y' = ${v} + ${x}·${v}', and the equation becomes separable: ${l} ${op} ${r}.
rule.ODE_HOMOGENEOUS_BACK.title=Undo the substitution
rule.ODE_HOMOGENEOUS_BACK.text=We go back to ${y} with ${v} = ${y}/${x}: ${l} ${op} ${r}.
rule.ODE_BERNOULLI_FORM.title=Bernoulli equation
rule.ODE_BERNOULLI_FORM.text=It is y' + P·y = Q·yⁿ, with n = ${n}, P = ${P} and Q = ${Q}: ${l} ${op} ${r}.
rule.ODE_BERNOULLI_SUBSTITUTION.title=Substitution z = y^(1−n)
rule.ODE_BERNOULLI_SUBSTITUTION.text=We divide by y^n and set ${z} = y^(${k}): this gives the linear equation ${l} ${op} ${r}.
rule.ODE_BERNOULLI_BACK.title=Undo the substitution
rule.ODE_BERNOULLI_BACK.text=We go back from ${z} to ${y}: ${l} ${op} ${r}.
rule.ODE_CHAR_EQUATION.title=Characteristic equation
rule.ODE_CHAR_EQUATION.text=We try y = e^(${s}·x): each derivative becomes a power of ${s}, and we get ${l} ${op} ${r}.
rule.ODE_ROOT_REAL.title=Real root
rule.ODE_ROOT_REAL.text=The root ${r} gives the solution e^(${r}·x).
rule.ODE_ROOT_REPEATED.title=Repeated root
rule.ODE_ROOT_REPEATED.text=The root ${r} has multiplicity ${m}: it gives the solutions x^k·e^(${r}·x), for k from 0 to ${m} − 1.
rule.ODE_ROOT_COMPLEX.title=Complex roots
rule.ODE_ROOT_COMPLEX.text=The roots ${a} ± ${b}·i (multiplicity ${m}) give e^(${a}·x)·cos(${b}·x) and e^(${a}·x)·sin(${b}·x), with x^k in front when repeated.
rule.ODE_HOMOGENEOUS_SOLUTION.title=Homogeneous solution
rule.ODE_HOMOGENEOUS_SOLUTION.text=One constant for each fundamental solution: ${l} ${op} ${r}.
rule.ODE_WRONSKIAN.title=Wronskian
rule.ODE_WRONSKIAN.text=With y₁ = ${y1} and y₂ = ${y2}, the Wronskian W = y₁·y₂' − y₁'·y₂ is ${r}.
rule.ODE_VARIATION.title=Variation of parameters
rule.ODE_VARIATION.text=With y_p = u₁·y₁ + u₂·y₂ we have u₁' = −y₂·g/W = ${u1} and u₂' = y₁·g/W = ${u2}. Integrating gives ${l} ${op} ${r}.
rule.ODE_UC_FORM.title=Undetermined coefficients
rule.ODE_UC_FORM.text=From the shape of ${g} we try ${l} ${op} ${r}, with coefficients A to find (multiplied by x when it matches a solution of the homogeneous equation).
rule.ODE_UC_SOLVE.title=Find the coefficients
rule.ODE_UC_SOLVE.text=We substitute into the equation and match it with ${g}, which gives the coefficients: ${l} ${op} ${r}.
rule.ODE_GENERAL_SOLUTION.title=General solution
rule.ODE_GENERAL_SOLUTION.text=It is the homogeneous solution plus the particular one: ${l} ${op} ${r}.
rule.ODE_REDUCE_ORDER.title=Reduce the order
rule.ODE_REDUCE_ORDER.text=An equation of order ${k} becomes first order with a new variable for each derivative of ${y} up to order ${k} − 1: the derivative of each is the next one, and the last comes from ${l} ${op} ${r}.
rule.ODE_SYSTEM_MATRIX.title=Linear system
rule.ODE_SYSTEM_MATRIX.text=It is a linear system with constant coefficients, X' = A·X, with X = ${X} and A = ${A}.
rule.ODE_SYSTEM_EIGEN.title=Eigenvalue and eigenvector
rule.ODE_SYSTEM_EIGEN.text=The eigenvalue λ = ${lambda} has the eigenvector ${v}, and gives solutions with e^(λ·x).
rule.ODE_SYSTEM_SOLUTION.title=General solution
rule.ODE_SYSTEM_SOLUTION.text=We combine the solutions with constants: ${l} ${op} ${r}.
rule.ODE_SOLVE_FOR_DERIVATIVE.title=Solve for the derivative
rule.ODE_SOLVE_FOR_DERIVATIVE.text=The equation is not linear in the derivative: we solve for it and get one equation per root (${r}).
rule.ODE_BRANCH.title=One of the branches
rule.ODE_BRANCH.text=We solve branch ${k}: ${l} ${op} ${r}.
rule.ODE_NOT_APPLICABLE.title=Method that does not apply
rule.ODE_NOT_APPLICABLE.text=This method does not work for this equation.
method.ode.AUTO.title=Automatic
method.ode.AUTO.desc=Tries the methods in order and uses the first that works.
method.ode.SEPARABLE.title=Separable
method.ode.SEPARABLE.desc=y' = g(x)·h(y): separate the variables and integrate each side.
method.ode.LINEAR.title=Linear
method.ode.LINEAR.desc=y' + P(x)·y = Q(x): multiply by the integrating factor e^∫P.
method.ode.EXACT.title=Exact
method.ode.EXACT.desc=M dx + N dy = 0 with ∂M/∂y = ∂N/∂x (or with an integrating factor in one variable).
method.ode.HOMOGENEOUS.title=Homogeneous
method.ode.HOMOGENEOUS.desc=y' = F(y/x): the substitution y = v·x makes it separable.
method.ode.BERNOULLI.title=Bernoulli
method.ode.BERNOULLI.desc=y' + P·y = Q·yⁿ: the substitution z = y^(1−n) makes it linear.
method.ode.CONSTANT_COEFFICIENTS.title=Constant coefficients
method.ode.CONSTANT_COEFFICIENTS.desc=Linear of order n with constant coefficients: characteristic equation.
method.ode.UNDETERMINED_COEFFICIENTS.title=Undetermined coefficients
method.ode.UNDETERMINED_COEFFICIENTS.desc=Particular solution of the non-homogeneous equation when the right side is a polynomial times an exponential times a sine or cosine.
method.ode.VARIATION_OF_PARAMETERS.title=Variation of parameters
method.ode.VARIATION_OF_PARAMETERS.desc=Particular solution of a second-order non-homogeneous equation for any integrable right side.

solution.kind.PDE.problem=Solve the partial differential equation ${l} ${op} ${r} by the method of characteristics.

rule.PDE_CHARACTERISTICS.title=Characteristic system
rule.PDE_CHARACTERISTICS.text=A solution is a surface made of characteristic curves, which satisfy ${p1} = ${p2} = ${p3}. We look for two first integrals: expressions that take the same value at every point of each characteristic.

rule.PDE_ZERO_RATE.title=A variable that does not change
rule.PDE_ZERO_RATE.text=The denominator of d${v} is 0, so d${v} = 0: ${v} does not change along a characteristic. It is a first integral: ${l} ${op} ${r}.

rule.PDE_PAIR.title=A pair of equations
rule.PDE_PAIR.text=We solve the pair d${vi}/${ri} = d${vj}/${rj}, in which ${w} is constant or does not appear: ${l} ${op} ${r}.

rule.PDE_SEPARABLE.title=Separable variables
rule.PDE_SEPARABLE.text=It is a separable equation: we move everything that depends on ${vj} to one side and everything that depends on ${vi} to the other, and integrate: ${l} ${op} ${r}.

rule.PDE_LINEAR.title=Linear equation
rule.PDE_LINEAR.text=The equation is linear in ${vj}: d${vj}/d${vi} = (${P})·${vj} + (${Q}). With the integrating factor ${mu} we get ${l} ${op} ${r}.

rule.PDE_EXPONENTIATE.title=Remove the logarithms
rule.PDE_EXPONENTIATE.text=We take exponentials on both sides. The new constant, e raised to the old one, is still a constant and we keep the same name: ${l} ${op} ${r}.

rule.PDE_FIRST_INTEGRAL.title=First integral
rule.PDE_FIRST_INTEGRAL.text=We have a first integral: ${l} ${op} ${r}. Its value is the same at every point of a characteristic.

rule.PDE_ELIMINATE.title=Solve for a variable
rule.PDE_ELIMINATE.text=For the second pair we use ${phi} = ${k}: solving for ${z} gives ${l} ${op} ${r}.

rule.PDE_SUBSTITUTE.title=Substitute the variable
rule.PDE_SUBSTITUTE.text=We substitute ${z} = ${Z} in the remaining pair, which leaves an equation with a single independent variable: ${l} ${op} ${r}.

rule.PDE_BACK_SUBSTITUTE.title=Undo the constant
rule.PDE_BACK_SUBSTITUTE.text=We write ${k} as ${phi} again: ${l} ${op} ${r}.

rule.PDE_CHECK.title=Check
rule.PDE_CHECK.text=We check with numeric values that ${phi} and ${psi} do not change along the characteristics: their derivative in the direction of the characteristic system is 0.

rule.PDE_GENERAL.title=General solution
rule.PDE_GENERAL.text=Any function of the two first integrals is constant on the characteristics. The general solution is written with an arbitrary function F: ${l} ${op} ${r}.

rule.PDE_EXPLICIT.title=Solve for the unknown
rule.PDE_EXPLICIT.text=We solve for the unknown, with ${f} an arbitrary function of one variable: ${l} ${op} ${r}.

rule.PDE_DATA.title=Initial data
rule.PDE_DATA.text=The initial data is the curve Γ given by ${x} = ${x0}, ${y} = ${y0}, ${u} = ${u0}, with parameter ${s}.

rule.PDE_TRANSVERSALITY.title=Transversality condition
rule.PDE_TRANSVERSALITY.text=There is a unique solution near Γ if Γ is not tangent to the characteristics, that is, if J = ${J} does not vanish on Γ.

rule.PDE_ON_CURVE.title=The integrals on the data
rule.PDE_ON_CURVE.text=On Γ, the first integrals take the values ${phi} = ${c1} and ${psi} = ${c2}, which depend only on ${s}.

rule.PDE_ELIMINATE_PARAMETER.title=Eliminate the parameter
rule.PDE_ELIMINATE_PARAMETER.text=From ${phi} = ${c1} we solve for the parameter: ${l} ${op} ${r}.

rule.PDE_PARTICULAR.title=Particular solution
rule.PDE_PARTICULAR.text=On each characteristic, ${psi} is worth what it is worth at its point of Γ, and the parameter of that point comes from ${phi}. The solution through Γ satisfies ${l} ${op} ${r}.

rule.PDE_PARTICULAR_EXPLICIT.title=Solve for the unknown
rule.PDE_PARTICULAR_EXPLICIT.text=We solve for the unknown: ${l} ${op} ${r}.

rule.PDE_NO_PAIR.title=Cannot be solved
rule.PDE_NO_PAIR.text=This characteristic system cannot be solved: none of its pairs can be treated alone without depending on the third variable.

rule.PDE_NOT_SOLVABLE.title=Cannot be solved
rule.PDE_NOT_SOLVABLE.text=The equation ${l} ${op} ${r} is neither separable nor linear, or it cannot be integrated. These methods cannot solve it.

rule.PDE_CANNOT_ISOLATE.title=Cannot solve for the variable
rule.PDE_CANNOT_ISOLATE.text=We cannot solve ${l} ${op} ${r} for ${z}, and without that we cannot go on with the second pair.

rule.PDE_DEGENERATE.title=No derivatives
rule.PDE_DEGENERATE.text=The coefficients ${a} and ${b} are both 0: the equation has no derivatives and there is nothing for the characteristics to solve.

rule.PDE_DATA_CHARACTERISTIC.title=The data is a characteristic
rule.PDE_DATA_CHARACTERISTIC.text=The curve Γ is tangent to the characteristics at all its points (J = ${J}): there is either no solution or infinitely many. Another initial data is needed.

rule.PDE_BRANCH.title=Cannot choose the branch
rule.PDE_BRANCH.text=Solving leaves more than one branch and the one chosen does not satisfy the initial data on Γ. It cannot be solved.
